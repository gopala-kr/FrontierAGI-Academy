<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="470" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Sixty years of the software lifecycle</text><text x="24" y="56" font-size="13" fill="#475569">How teams have organised building software, 1956 → 2026</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><line class="dr" x1="40" y1="250" x2="1160" y2="250" stroke="#334155" stroke-width="3"/><g class="fd" style="animation-delay:0.0s"><circle cx="100" cy="250" r="9" fill="#64748b"/><line x1="100" y1="241" x2="100" y2="170" stroke="#64748b" stroke-dasharray="3 3"/><text x="100" y="136" font-size="13" fill="#64748b" text-anchor="middle" font-weight="700">1956</text><text x="100" y="154" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="700">Stagewise model</text><text x="100" y="170" font-size="11.5" fill="#475569" text-anchor="middle">SAGE air defence (Benington)</text></g><g class="fd" style="animation-delay:0.15s"><circle cx="211" cy="250" r="9" fill="#2563eb"/><line x1="211" y1="259" x2="211" y2="294" stroke="#2563eb" stroke-dasharray="3 3"/><text x="211" y="330" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="700">1970</text><text x="211" y="348" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="700">Royce paper</text><text x="211" y="364" font-size="11.5" fill="#475569" text-anchor="middle">later called &quot;waterfall&quot;</text></g><g class="fd" style="animation-delay:0.3s"><circle cx="322" cy="250" r="9" fill="#7c3aed"/><line x1="322" y1="241" x2="322" y2="170" stroke="#7c3aed" stroke-dasharray="3 3"/><text x="322" y="136" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">1986</text><text x="322" y="154" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="700">Spiral model</text><text x="322" y="170" font-size="11.5" fill="#475569" text-anchor="middle">Boehm: risk-driven loops</text></g><g class="fd" style="animation-delay:0.44999999999999996s"><circle cx="433" cy="250" r="9" fill="#16a34a"/><line x1="433" y1="259" x2="433" y2="294" stroke="#16a34a" stroke-dasharray="3 3"/><text x="433" y="330" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="700">2001</text><text x="433" y="348" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="700">Agile Manifesto</text><text x="433" y="364" font-size="11.5" fill="#475569" text-anchor="middle">17 people, Snowbird</text></g><g class="fd" style="animation-delay:0.6s"><circle cx="544" cy="250" r="9" fill="#0d9488"/><line x1="544" y1="241" x2="544" y2="170" stroke="#0d9488" stroke-dasharray="3 3"/><text x="544" y="136" font-size="13" fill="#0d9488" text-anchor="middle" font-weight="700">2009</text><text x="544" y="154" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="700">DevOps</text><text x="544" y="170" font-size="11.5" fill="#475569" text-anchor="middle">DevOpsDays, Ghent</text></g><g class="fd" style="animation-delay:0.75s"><circle cx="655" cy="250" r="9" fill="#0891b2"/><line x1="655" y1="259" x2="655" y2="294" stroke="#0891b2" stroke-dasharray="3 3"/><text x="655" y="330" font-size="13" fill="#0891b2" text-anchor="middle" font-weight="700">2014</text><text x="655" y="348" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="700">DORA</text><text x="655" y="364" font-size="11.5" fill="#475569" text-anchor="middle">State of DevOps</text></g><g class="fd" style="animation-delay:0.8999999999999999s"><circle cx="766" cy="250" r="9" fill="#ea580c"/><line x1="766" y1="241" x2="766" y2="170" stroke="#ea580c" stroke-dasharray="3 3"/><text x="766" y="136" font-size="13" fill="#ea580c" text-anchor="middle" font-weight="700">2018</text><text x="766" y="154" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="700">Accelerate</text><text x="766" y="170" font-size="11.5" fill="#475569" text-anchor="middle">four key metrics</text></g><g class="fd" style="animation-delay:1.05s"><circle cx="877" cy="250" r="9" fill="#db2777"/><line x1="877" y1="259" x2="877" y2="294" stroke="#db2777" stroke-dasharray="3 3"/><text x="877" y="330" font-size="13" fill="#db2777" text-anchor="middle" font-weight="700">2022</text><text x="877" y="348" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="700">AI coding</text><text x="877" y="364" font-size="11.5" fill="#475569" text-anchor="middle">assistants spread</text></g><g class="fd" style="animation-delay:1.2s"><circle cx="988" cy="250" r="9" fill="#dc2626"/><line x1="988" y1="241" x2="988" y2="170" stroke="#dc2626" stroke-dasharray="3 3"/><text x="988" y="136" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">2025</text><text x="988" y="154" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="700">90% use AI</text><text x="988" y="170" font-size="11.5" fill="#475569" text-anchor="middle">DORA 2025 survey</text></g><g class="fd" style="animation-delay:1.3499999999999999s"><circle cx="1099" cy="250" r="9" fill="#b91c1c"/><line x1="1099" y1="259" x2="1099" y2="294" stroke="#b91c1c" stroke-dasharray="3 3"/><text x="1099" y="330" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="700">2026</text><text x="1099" y="348" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="700">ADLC</text><text x="1099" y="364" font-size="11.5" fill="#475569" text-anchor="middle">agents build and ship</text></g><text x="24" y="450" font-size="11.5" fill="#64748b" text-anchor="start">Sources in Part 1. &quot;Waterfall&quot; was a later label; Royce himself warned the simple sequence was risky.</text></svg>