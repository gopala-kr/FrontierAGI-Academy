<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="440" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Operations: one agent run as a trace</text><text x="24" y="56" font-size="13" fill="#475569">Part 9: every model call and tool call is a span (illustrative timings and costs)</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><text x="24" y="110" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">agent run: refund ticket #4821</text><rect class="gr" style="animation-delay:0.0s" x="330" y="94" width="760" height="24" rx="5" fill="#0f172a"/><text x="324.0" y="111" font-size="12" fill="#334155" text-anchor="end">8.1 s · $0.031</text><text x="24" y="154" font-size="13" fill="#0f172a" text-anchor="start">model: plan</text><rect class="gr" style="animation-delay:0.18s" x="345" y="138" width="152" height="24" rx="5" fill="#2563eb"/><text x="503.2" y="155" font-size="12" fill="#334155" text-anchor="start">1.6 s · 2.1k tok</text><text x="24" y="198" font-size="13" fill="#0f172a" text-anchor="start">tool: look_up_customer</text><rect class="gr" style="animation-delay:0.36s" x="512" y="182" width="46" height="24" rx="5" fill="#0d9488"/><text x="564.0" y="199" font-size="12" fill="#334155" text-anchor="start">0.5 s</text><text x="24" y="242" font-size="13" fill="#0f172a" text-anchor="start">model: decide</text><rect class="gr" style="animation-delay:0.54s" x="566" y="226" width="182" height="24" rx="5" fill="#2563eb"/><text x="754.0" y="243" font-size="12" fill="#334155" text-anchor="start">1.9 s · 3.4k tok</text><text x="24" y="286" font-size="13" fill="#0f172a" text-anchor="start">guardrail: policy check</text><rect class="gr" style="animation-delay:0.72s" x="756" y="270" width="30" height="24" rx="5" fill="#ca8a04"/><text x="791.9999999999999" y="287" font-size="12" fill="#334155" text-anchor="start">0.3 s</text><text x="24" y="330" font-size="13" fill="#0f172a" text-anchor="start">tool: refund($40)</text><rect class="gr" style="animation-delay:0.8999999999999999s" x="794" y="314" width="84" height="24" rx="5" fill="#0d9488"/><text x="883.1999999999999" y="331" font-size="12" fill="#334155" text-anchor="start">0.9 s</text><text x="24" y="374" font-size="13" fill="#0f172a" text-anchor="start">model: reply</text><rect class="gr" style="animation-delay:1.08s" x="885" y="358" width="190" height="24" rx="5" fill="#2563eb"/><text x="878.8" y="375" font-size="12" fill="#334155" text-anchor="end">2.0 s · 1.2k tok</text><text x="24" y="415" font-size="12.5" fill="#475569" text-anchor="start">What operators watch across thousands of traces: success rate, cost per task, latency, escalations, policy blocks, and drift after changes.</text></svg>