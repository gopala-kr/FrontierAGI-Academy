<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="460" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Maintenance: the improvement loop and its gate</text><text x="24" y="56" font-size="13" fill="#475569">Part 10: production failures become eval cases; changes ship only through the gate</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="fd" style="animation-delay:0.0s"><rect x="490" y="69" width="220" height="52" rx="10" fill="#0f172a14" stroke="#0f172a" stroke-width="1.6"/><text x="600.0" y="100.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Production traces</text></g><g class="fd" style="animation-delay:0.15s"><rect x="850" y="164" width="220" height="52" rx="10" fill="#dc262614" stroke="#dc2626" stroke-width="1.6"/><text x="960.0" y="195.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Find failures</text></g><g class="fd" style="animation-delay:0.3s"><rect x="850" y="304" width="220" height="52" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="1.6"/><text x="960.0" y="335.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Add to eval set</text></g><g class="fd" style="animation-delay:0.44999999999999996s"><rect x="490" y="384" width="220" height="52" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="600.0" y="415.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Propose a fix</text></g><g class="fd" style="animation-delay:0.6s"><rect x="130" y="304" width="220" height="52" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6"/><text x="240.0" y="335.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Run evals</text></g><g class="fd" style="animation-delay:0.75s"><rect x="130" y="164" width="220" height="52" rx="10" fill="#c2410c14" stroke="#c2410c" stroke-width="1.6"/><text x="240.0" y="195.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Human gate</text></g><line x1="715.2" y1="125.4" x2="844.8" y2="159.60000000000002" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="960.0" y1="234.8" x2="960.0" y2="285.2" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="844.8" y1="355.6" x2="715.2" y2="384.4" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="484.8" y1="384.4" x2="355.2" y2="355.6" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="240.0" y1="285.2" x2="240.0" y2="234.8" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="355.2" y1="159.6" x2="484.8" y2="125.39999999999999" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><text x="600" y="250" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">Who proposes the fix?</text><text x="600" y="274" font-size="13" fill="#475569" text-anchor="middle">L1–L2: people · L3: agents suggest · L4+: agents apply</text><text x="600" y="296" font-size="12" fill="#64748b" text-anchor="middle">(levels from our RSI 