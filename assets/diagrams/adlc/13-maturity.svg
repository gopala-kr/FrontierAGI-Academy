<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="420" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">ADLC maturity: five levels</text><text x="24" y="56" font-size="13" fill="#475569">Part 12: where most teams are, and what the next level adds (our framework, modelled loosely on CMM)</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect class="gu" style="animation-delay:0.0s" x="30" y="290" width="216" height="80" rx="10" fill="#dc262622" stroke="#dc2626" stroke-width="2"/><text x="138" y="318" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">1 Ad hoc</text><text x="138" y="342" font-size="12.5" fill="#334155" text-anchor="middle">prompts edited by hand;</text><text x="138" y="360" font-size="12.5" fill="#334155" text-anchor="middle">tested on a few examples</text><rect class="gu" style="animation-delay:0.15s" x="262" y="245" width="216" height="125" rx="10" fill="#ea580c22" stroke="#ea580c" stroke-width="2"/><text x="370" y="273" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">2 Repeatable</text><text x="370" y="297" font-size="12.5" fill="#334155" text-anchor="middle">fixed eval set</text><text x="370" y="315" font-size="12.5" fill="#334155" text-anchor="middle">before releases</text><rect class="gu" style="animation-delay:0.3s" x="494" y="200" width="216" height="170" rx="10" fill="#ca8a0422" stroke="#ca8a04" stroke-width="2"/><text x="602" y="228" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">3 Defined</text><text x="602" y="252" font-size="12.5" fill="#334155" text-anchor="middle">evals in CI, versioned bundle,</text><text x="602" y="270" font-size="12.5" fill="#334155" text-anchor="middle">guardrails, tracing</text><rect class="gu" style="animation-delay:0.44999999999999996s" x="726" y="155" width="216" height="215" rx="10" fill="#16a34a22" stroke="#16a34a" stroke-width="2"/><text x="834" y="183" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">4 Managed</text><text x="834" y="207" font-size="12.5" fill="#334155" text-anchor="middle">staged rollout, drift + cost</text><text x="834" y="225" font-size="12.5" fill="#334155" text-anchor="middle">dashboards, red-team</text><rect class="gu" style="animation-delay:0.6s" x="958" y="110" width="216" height="260" rx="10" fill="#0d948822" stroke="#0d9488" stroke-width="2"/><text x="1066" y="138" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">5 Optimising</text><text x="1066" y="162" font-size="12.5" fill="#334155" text-anchor="middle">failures flow into evals;</text><text x="1066" y="180" font-size="12.5" fill="#334155" text-anchor="middle">agents propose, people gate</text><text x="600" y="405" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">Score yourself with the self-assessment in Part 12.</text></svg>