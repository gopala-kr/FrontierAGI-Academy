<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="520" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">From SDLC to ADLC: what each stage becomes</text><text x="24" y="56" font-size="13" fill="#475569">Same job, new artefacts. Parts 3–10 of this series take one stage each</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><text x="24" y="104" font-size="15" fill="#2563eb" text-anchor="start" font-weight="700">SDLC</text><text x="24" y="330" font-size="15" fill="#c2410c" text-anchor="start" font-weight="700">ADLC</text><g class="fd" style="animation-delay:0.0s"><rect x="90" y="80" width="124" height="60" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="152.0" y="115.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Requirements</text></g><g class="fd" style="animation-delay:0.8s"><rect x="90" y="300" width="124" height="74" rx="10" fill="#ea580c14" stroke="#ea580c" stroke-width="1.6"/><text x="152.0" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Task specs</text><text x="152.0" y="342" text-anchor="middle" font-size="12" fill="#334155">+ eval sets</text></g><line x1="152" y1="146" x2="152" y2="292" stroke="#94a3b8" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.1s"><rect x="227" y="80" width="124" height="60" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="289.0" y="115.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Design</text></g><g class="fd" style="animation-delay:0.9s"><rect x="227" y="300" width="124" height="74" rx="10" fill="#ea580c14" stroke="#ea580c" stroke-width="1.6"/><text x="289.0" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Agent</text><text x="289.0" y="342" text-anchor="middle" font-size="12" fill="#334155">architecture</text></g><line x1="289" y1="146" x2="289" y2="292" stroke="#94a3b8" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.2s"><rect x="364" y="80" width="124" height="60" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="426.0" y="115.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Code</text></g><g class="fd" style="animation-delay:1.0s"><rect x="364" y="300" width="124" height="74" rx="10" fill="#ea580c14" stroke="#ea580c" stroke-width="1.6"/><text x="426.0" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Context,</text><text x="426.0" y="342" text-anchor="middle" font-size="12" fill="#334155">tools, prompts</text></g><line x1="426" y1="146" x2="426" y2="292" stroke="#94a3b8" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.30000000000000004s"><rect x="501" y="80" width="124" height="60" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="563.0" y="115.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Test</text></g><g class="fd" style="animation-delay:1.1s"><rect x="501" y="300" width="124" height="74" rx="10" fill="#ea580c14" stroke="#ea580c" stroke-width="1.6"/><text x="563.0" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Evaluation</text><text x="563.0" y="342" text-anchor="middle" font-size="12" fill="#334155">(evals)</text></g><line x1="563" y1="146" x2="563" y2="292" stroke="#94a3b8" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.4s"><rect x="638" y="80" width="124" height="60" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="700.0" y="115.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Secure</text></g><g class="fd" style="animation-delay:1.2000000000000002s"><rect x="638" y="300" width="124" height="74" rx="10" fill="#ea580c14" stroke="#ea580c" stroke-width="1.6"/><text x="700.0" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Guardrails</text><text x="700.0" y="342" text-anchor="middle" font-size="12" fill="#334155">+ red-team</text></g><line x1="700" y1="146" x2="700" y2="292" stroke="#94a3b8" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.5s"><rect x="775" y="80" width="124" height="60" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="837.0" y="115.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Release</text></g><g class="fd" style="animation-delay:1.3s"><rect x="775" y="300" width="124" height="74" rx="10" fill="#ea580c14" stroke="#ea580c" stroke-width="1.6"/><text x="837.0" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Staged</text><text x="837.0" y="342" text-anchor="middle" font-size="12" fill="#334155">model rollout</text></g><line x1="837" y1="146" x2="837" y2="292" stroke="#94a3b8" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.6000000000000001s"><rect x="912" y="80" width="124" height="60" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="974.0" y="115.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Operate</text></g><g class="fd" style="animation-delay:1.4000000000000001s"><rect x="912" y="300" width="124" height="74" rx="10" fill="#ea580c14" stroke="#ea580c" stroke-width="1.6"/><text x="974.0" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Traces,</text><text x="974.0" y="342" text-anchor="middle" font-size="12" fill="#334155">cost, drift</text></g><line x1="974" y1="146" x2="974" y2="292" stroke="#94a3b8" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.7000000000000001s"><rect x="1049" y="80" width="124" height="60" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="1111.0" y="115.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Maintain</text></g><g class="fd" style="animation-delay:1.5s"><rect x="1049" y="300" width="124" height="74" rx="10" fill="#ea580c14" stroke="#ea580c" stroke-width="1.6"/><text x="1111.0" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Continuous</text><text x="1111.0" y="342" text-anchor="middle" font-size="12" fill="#334155">improvement</text></g><line x1="1111" y1="146" x2="1111" y2="292" stroke="#94a3b8" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#a)"/><path class="dr" d="M 1110 378 C 1100 450, 160 450, 152 382" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#a)"/><text x="600" y="475" font-size="13" fill="#c2410c" text-anchor="middle" font-weight="700">Production learning feeds the next spec: the ADLC is a loop, not a line</text></svg>