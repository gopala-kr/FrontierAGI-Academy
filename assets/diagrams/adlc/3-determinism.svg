<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" width="1100" height="400" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1100" height="400" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Why the old cycle breaks: same input, different outputs</text><text x="24" y="56" font-size="13" fill="#475569">Ordinary code vs a model inside the software (illustrative)</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="24" y="80" width="500" height="280" rx="12" fill="#2563eb0d" stroke="#2563eb" stroke-width="1.2"/><text x="36" y="100" font-size="12" font-weight="800" fill="#2563eb" letter-spacing=".5">ORDINARY CODE</text><rect x="576" y="80" width="500" height="280" rx="12" fill="#c2410c0d" stroke="#c2410c" stroke-width="1.2"/><text x="588" y="100" font-size="12" font-weight="800" fill="#c2410c" letter-spacing=".5">SOFTWARE WITH A MODEL INSIDE</text><rect x="54" y="130" width="140" height="50" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="124.0" y="160.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Input</text><rect x="234" y="130" width="120" height="50" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="294.0" y="160.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Function</text><rect x="394" y="130" width="110" height="50" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="449.0" y="160.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Output</text><line x1="194" y1="155" x2="232" y2="155" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="354" y1="155" x2="392" y2="155" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><text x="54" y="230" font-size="14" fill="#0f172a" text-anchor="start">Same input → same output, every time.</text><text x="54" y="256" font-size="14" fill="#0f172a" text-anchor="start">A test passes or fails.</text><text x="54" y="282" font-size="14" fill="#0f172a" text-anchor="start">Ship once; it behaves the same.</text><rect x="600" y="150" width="110" height="50" rx="10" fill="#c2410c14" stroke="#c2410c" stroke-width="1.6"/><text x="655.0" y="180.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Input</text><rect x="740" y="150" width="110" height="50" rx="10" fill="#c2410c14" stroke="#c2410c" stroke-width="1.6"/><text x="795.0" y="180.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Model</text><g class="fd" style="animation-delay:0.4s"><rect x="900" y="100" width="150" height="44" rx="10" fill="#c2410c14" stroke="#c2410c" stroke-width="1.6"/><text x="975.0" y="127.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Answer A</text></g><line x1="850" y1="175" x2="898" y2="122" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.7s"><rect x="900" y="160" width="150" height="44" rx="10" fill="#c2410c14" stroke="#c2410c" stroke-width="1.6"/><text x="975.0" y="187.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Answer B</text></g><line x1="850" y1="175" x2="898" y2="182" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:1.0s"><rect x="900" y="220" width="150" height="44" rx="10" fill="#c2410c14" stroke="#c2410c" stroke-width="1.6"/><text x="975.0" y="247.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Answer C</text></g><line x1="850" y1="175" x2="898" y2="242" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><text x="600" y="300" font-size="14" fill="#0f172a" text-anchor="start">Same input → a range of outputs. Quality is a rate,</text><text x="600" y="324" font-size="14" fill="#0f172a" text-anchor="start">measured with evals; models, prompts and data all change.</text></svg>