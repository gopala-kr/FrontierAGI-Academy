<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="420" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">From a user story to an eval set</text><text x="24" y="56" font-size="13" fill="#475569">Part 3: requirements become example tasks with a pass rule and a target rate</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="fd" style="animation-delay:0.0s"><rect x="24" y="110" width="210" height="110" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="129.0" y="132" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">User story</text><text x="129.0" y="152" text-anchor="middle" font-size="12" fill="#334155">&quot;As a customer I want a refund&quot;</text><text x="129.0" y="168" text-anchor="middle" font-size="12" fill="#334155">for a faulty order&quot;</text></g><g class="fd" style="animation-delay:0.2s"><rect x="260" y="110" width="210" height="110" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="1.6"/><text x="365.0" y="132" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Task examples</text><text x="365.0" y="152" text-anchor="middle" font-size="12" fill="#334155">200 real tickets</text><text x="365.0" y="168" text-anchor="middle" font-size="12" fill="#334155">(sampled from history)</text></g><line x1="236" y1="165" x2="258" y2="165" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.4s"><rect x="496" y="110" width="210" height="110" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6"/><text x="601.0" y="132" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Grading rule</text><text x="601.0" y="152" text-anchor="middle" font-size="12" fill="#334155">Correct decision?</text><text x="601.0" y="168" text-anchor="middle" font-size="12" fill="#334155">Policy kept? Tone ok?</text></g><line x1="472" y1="165" x2="494" y2="165" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.6000000000000001s"><rect x="732" y="110" width="210" height="110" rx="10" fill="#dc262614" stroke="#dc2626" stroke-width="1.6"/><text x="837.0" y="132" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Edge + attack cases</text><text x="837.0" y="152" text-anchor="middle" font-size="12" fill="#334155">limits, missing data,</text><text x="837.0" y="168" text-anchor="middle" font-size="12" fill="#334155">prompt injection</text></g><line x1="708" y1="165" x2="730" y2="165" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.8s"><rect x="968" y="110" width="210" height="110" rx="10" fill="#c2410c14" stroke="#c2410c" stroke-width="1.6"/><text x="1073.0" y="132" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Target</text><text x="1073.0" y="152" text-anchor="middle" font-size="12" fill="#334155">90% correct,</text><text x="1073.0" y="168" text-anchor="middle" font-size="12" fill="#334155">0 policy breaks</text></g><line x1="944" y1="165" x2="966" y2="165" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><text x="24" y="280" font-size="13" fill="#334155" text-anchor="start">Illustrative numbers. The eval set is written before the agent is built, and grows every time production finds a new failure (Part 10).</text></svg>