<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="380" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Design: how much does the system decide?</text><text x="24" y="56" font-size="13" fill="#475569">Part 4: from fixed workflows to autonomous agents (after Anthropic’s &quot;workflows vs agents&quot; distinction)</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="g5" x1="0" x2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#dc2626"/></linearGradient></defs><rect class="gr" x="40" y="120" width="1120" height="18" rx="9" fill="url(#g5)"/><g class="fd" style="animation-delay:0.3s"><circle cx="110" cy="129" r="13" fill="#fff" stroke="#0f172a" stroke-width="2"/><text x="110" y="180" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">Single call</text><text x="110" y="204" font-size="13" fill="#334155" text-anchor="middle">one prompt, one answer</text><text x="110" y="224" font-size="12.5" fill="#64748b" text-anchor="middle">cheapest, most predictable</text></g><g class="fd" style="animation-delay:0.5s"><circle cx="440" cy="129" r="13" fill="#fff" stroke="#0f172a" stroke-width="2"/><text x="440" y="180" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">Workflow</text><text x="440" y="204" font-size="13" fill="#334155" text-anchor="middle">fixed steps in code</text><text x="440" y="224" font-size="12.5" fill="#64748b" text-anchor="middle">prompt chain, router, parallel</text></g><g class="fd" style="animation-delay:0.7s"><circle cx="770" cy="129" r="13" fill="#fff" stroke="#0f172a" stroke-width="2"/><text x="770" y="180" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">Agent with gates</text><text x="770" y="204" font-size="13" fill="#334155" text-anchor="middle">model picks tools</text><text x="770" y="224" font-size="12.5" fill="#64748b" text-anchor="middle">humans approve risky steps</text></g><g class="fd" style="animation-delay:0.9000000000000001s"><circle cx="1100" cy="129" r="13" fill="#fff" stroke="#0f172a" stroke-width="2"/><text x="1100" y="180" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">Autonomous agent</text><text x="1100" y="204" font-size="13" fill="#334155" text-anchor="middle">model plans and acts</text><text x="1100" y="224" font-size="12.5" fill="#64748b" text-anchor="middle">long tasks, least predictable</text></g><text x="40" y="300" font-size="13" fill="#2563eb" text-anchor="start" font-weight="700">← more control, cost and reliability</text><text x="1160" y="300" font-size="13" fill="#dc2626" text-anchor="end" font-weight="700">more flexibility and capability →</text><text x="600" y="350" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">Rule of thumb: use the simplest option that meets the eval target.</text></svg>