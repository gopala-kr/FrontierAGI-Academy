<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" width="1100" height="460" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1100" height="460" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Code becomes context: what fills the window</text><text x="24" y="56" font-size="13" fill="#475569">Part 5: one agent turn, by share of tokens (illustrative)</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect class="gr" style="animation-delay:0.0s" x="60" y="80" width="420" height="23.4" rx="5" fill="#2563eb"/><text x="500" y="98.2" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">System prompt and instructions  ·  8%</text><rect class="gr" style="animation-delay:0.15s" x="60" y="106.4" width="420" height="30.0" rx="5" fill="#7c3aed"/><text x="500" y="127.9" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">Tool definitions  ·  10%</text><rect class="gr" style="animation-delay:0.3s" x="60" y="139.4" width="420" height="36.599999999999994" rx="5" fill="#0d9488"/><text x="500" y="164.2" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">Context files and skills (e.g. CLAUDE.md)  ·  12%</text><rect class="gr" style="animation-delay:0.44999999999999996s" x="60" y="179.0" width="420" height="79.5" rx="5" fill="#ca8a04"/><text x="500" y="225.25" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">Retrieved documents  ·  25%</text><rect class="gr" style="animation-delay:0.6s" x="60" y="261.5" width="420" height="112.5" rx="5" fill="#ea580c"/><text x="500" y="324.25" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">Conversation and tool results so far  ·  35%</text><rect class="gr" style="animation-delay:0.75s" x="60" y="377.0" width="420" height="30.0" rx="5" fill="#94a3b8"/><text x="500" y="398.5" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">Room left for the answer  ·  10%</text><text x="60" y="440.0" font-size="12.5" fill="#475569" text-anchor="start">Shares are an example, not a measurement. Long agent runs fill the window with tool results, which is why context engineering matters.</text></svg>