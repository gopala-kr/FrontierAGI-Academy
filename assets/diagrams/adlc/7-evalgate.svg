<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="380" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Test becomes evaluation: the release gate</text><text x="24" y="56" font-size="13" fill="#475569">Part 6: every change to model, prompt, tools or context runs the same eval set</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="fd" style="animation-delay:0.0s"><rect x="24" y="120" width="200" height="90" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="124.0" y="142" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Change</text><text x="124.0" y="162" text-anchor="middle" font-size="12" fill="#334155">model, prompt, tool</text></g><g class="fd" style="animation-delay:0.2s"><rect x="254" y="120" width="200" height="90" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="1.6"/><text x="354.0" y="142" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Run eval set</text><text x="354.0" y="162" text-anchor="middle" font-size="12" fill="#334155">200 tasks × 3 runs</text></g><line x1="224" y1="165" x2="252" y2="165" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.4s"><rect x="484" y="120" width="200" height="90" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6"/><text x="584.0" y="142" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Grade</text><text x="584.0" y="162" text-anchor="middle" font-size="12" fill="#334155">code checks, LLM judge,</text><text x="584.0" y="178" text-anchor="middle" font-size="12" fill="#334155">human spot-checks</text></g><line x1="454" y1="165" x2="482" y2="165" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><g class="fd" style="animation-delay:0.6000000000000001s"><rect x="714" y="120" width="200" height="90" rx="10" fill="#ca8a0414" stroke="#ca8a04" stroke-width="1.6"/><text x="814.0" y="142" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Compare</text><text x="814.0" y="162" text-anchor="middle" font-size="12" fill="#334155">vs last release</text></g><line x1="684" y1="165" x2="712" y2="165" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><polygon points="1010,115 1080,165 1010,215 940,165" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="1010" y="162" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">Pass</text><text x="1010" y="178" font-size="12" fill="#0f172a" text-anchor="middle">threshold?</text><line x1="944" y1="165" x2="936" y2="165" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="1080" y1="165" x2="1150" y2="165" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><text x="1150" y="150" font-size="14" fill="#16a34a" text-anchor="end" font-weight="700">Release</text><line x1="1010" y1="215" x2="1010" y2="280" stroke="#dc2626" stroke-width="1.7" marker-end="url(#r)"/><rect x="999.2" y="229.5" width="21.6" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="1010.0" y="241.5" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">no</text><text x="1010" y="300" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">Back to change; add the failures to the eval set</text><text x="24" y="345" font-size="12.5" fill="#475569" text-anchor="start">Numbers are an example. Unlike a unit test, the result is a rate with uncertainty: see the calculator in Part 6.</text></svg>