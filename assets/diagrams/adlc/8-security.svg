<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="430" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Security: defence in layers around an agent</text><text x="24" y="56" font-size="13" fill="#475569">Part 7: no single check stops prompt injection; each layer narrows what an attack can do</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="fd" style="animation-delay:0.0s"><rect x="30" y="100" width="176" height="120" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="118.0" y="122" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">Input checks</text><text x="118.0" y="142" text-anchor="middle" font-size="12" fill="#334155">classify and filter</text><text x="118.0" y="158" text-anchor="middle" font-size="12" fill="#334155">untrusted text</text></g><g class="fd" style="animation-delay:0.15s"><rect x="222" y="100" width="176" height="120" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="1.6"/><text x="310.0" y="122" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">Least privilege</text><text x="310.0" y="142" text-anchor="middle" font-size="12" fill="#334155">only the tools and</text><text x="310.0" y="158" text-anchor="middle" font-size="12" fill="#334155">data the task needs</text></g><g class="fd" style="animation-delay:0.3s"><rect x="414" y="100" width="176" height="120" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6"/><text x="502.0" y="122" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">Limits in code</text><text x="502.0" y="142" text-anchor="middle" font-size="12" fill="#334155">amounts, rates, budgets</text><text x="502.0" y="158" text-anchor="middle" font-size="12" fill="#334155">enforced by tools</text></g><g class="fd" style="animation-delay:0.44999999999999996s"><rect x="606" y="100" width="176" height="120" rx="10" fill="#ca8a0414" stroke="#ca8a04" stroke-width="1.6"/><text x="694.0" y="122" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">Human approval</text><text x="694.0" y="142" text-anchor="middle" font-size="12" fill="#334155">risky or</text><text x="694.0" y="158" text-anchor="middle" font-size="12" fill="#334155">irreversible actions</text></g><g class="fd" style="animation-delay:0.6s"><rect x="798" y="100" width="176" height="120" rx="10" fill="#ea580c14" stroke="#ea580c" stroke-width="1.6"/><text x="886.0" y="122" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">Output checks</text><text x="886.0" y="142" text-anchor="middle" font-size="12" fill="#334155">no secrets or personal</text><text x="886.0" y="158" text-anchor="middle" font-size="12" fill="#334155">data leave</text></g><g class="fd" style="animation-delay:0.75s"><rect x="990" y="100" width="176" height="120" rx="10" fill="#dc262614" stroke="#dc2626" stroke-width="1.6"/><text x="1078.0" y="122" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">Sandbox + supply</text><text x="1078.0" y="142" text-anchor="middle" font-size="12" fill="#334155">isolated execution,</text><text x="1078.0" y="158" text-anchor="middle" font-size="12" fill="#334155">scanned dependencies</text></g><path class="dr" d="M 20 300 L 1180 300" stroke="#dc2626" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#r)"/><text x="40" y="290" font-size="13" fill="#dc2626" text-anchor="start" font-weight="700">Attack (e.g. a hidden instruction in an email the agent reads)</text><circle cx="118" cy="300" r="8" fill="#fff" stroke="#0f172a" stroke-width="2"/><circle cx="310" cy="300" r="8" fill="#fff" stroke="#0f172a" stroke-width="2"/><circle cx="502" cy="300" r="8" fill="#fff" stroke="#0f172a" stroke-width="2"/><circle cx="694" cy="300" r="8" fill="#fff" stroke="#0f172a" stroke-width="2"/><circle cx="886" cy="300" r="8" fill="#fff" stroke="#0f172a" stroke-width="2"/><circle cx="1078" cy="300" r="8" fill="#fff" stroke="#0f172a" stroke-width="2"/><text x="600" y="350" font-size="12.5" fill="#475569" text-anchor="middle">Each circle is a layer the attack must pass. Our summary of OWASP LLM Top 10 (2025) and vendor guidance.</text></svg>