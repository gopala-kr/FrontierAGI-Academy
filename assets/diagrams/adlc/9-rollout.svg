<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="420" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Release: staged rollout of model, prompt and tools together</text><text x="24" y="56" font-size="13" fill="#475569">Part 8: share of real traffic over time (illustrative)</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><line x1="80" y1="330" x2="1120" y2="330" stroke="#334155"/><line x1="80" y1="330" x2="80" y2="110" stroke="#334155"/><path class="dr" d="M80 330 L236 330 L236 330 L392 328 L548 319 L704 275 L860 220 L1120 110" fill="none" stroke="#c2410c" stroke-width="4"/><text x="152.8" y="352" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="700">Shadow (0%: runs, not shown)</text><text x="392.0" y="352" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="700">Canary 1%</text><text x="548.0" y="352" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="700">5%</text><text x="704.0" y="352" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="700">25%</text><text x="860.0" y="352" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="700">50%</text><text x="1068.0" y="352" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="700">100%</text><text x="600.0" y="98" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">At each step: compare success, cost and complaints with the old version; roll back if worse</text><text x="70" y="114" font-size="12" fill="#475569" text-anchor="end">100%</text><text x="70" y="334" font-size="12" fill="#475569" text-anchor="end">0%</text></svg>