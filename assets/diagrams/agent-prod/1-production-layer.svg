<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1280" height="520" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">The production layer: five services every agent call passes through</text><text x="24" y="56" font-size="13" fill="#475569">One model call from the action agent, with each production service it touches</text><rect x="40" y="200" width="200" height="90" rx="10" fill="#15803d14" stroke="#15803d" stroke-width="1.6"/><text x="140.0" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Agent</text><text x="140.0" y="242" text-anchor="middle" font-size="12" fill="#334155">wants to call a model</text><rect x="280" y="200" width="176" height="90" rx="10" fill="#be185d14" stroke="#be185d" stroke-width="1.6"/><text x="368.0" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Identity</text><text x="368.0" y="242" text-anchor="middle" font-size="12" fill="#334155">who is this agent, for whom?</text><line x1="242" y1="245" x2="278" y2="245" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="476" y="200" width="176" height="90" rx="10" fill="#dc262614" stroke="#dc2626" stroke-width="1.6"/><text x="564.0" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Guardrail (in)</text><text x="564.0" y="242" text-anchor="middle" font-size="12" fill="#334155">is the input safe?</text><line x1="456" y1="245" x2="474" y2="245" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="672" y="200" width="176" height="90" rx="10" fill="#0369a114" stroke="#0369a1" stroke-width="1.6"/><text x="760.0" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">LLM gateway</text><text x="760.0" y="242" text-anchor="middle" font-size="12" fill="#334155">route, budget, fallback</text><line x1="652" y1="245" x2="670" y2="245" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="868" y="200" width="176" height="90" rx="10" fill="#d9770614" stroke="#d97706" stroke-width="1.6"/><text x="956.0" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Model</text><text x="956.0" y="242" text-anchor="middle" font-size="12" fill="#334155">answer</text><line x1="848" y1="245" x2="866" y2="245" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="1064" y="200" width="176" height="90" rx="10" fill="#dc262614" stroke="#dc2626" stroke-width="1.6"/><text x="1152.0" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Guardrail (out)</text><text x="1152.0" y="242" text-anchor="middle" font-size="12" fill="#334155">is the output safe?</text><line x1="1044" y1="245" x2="1062" y2="245" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="40" y="360" width="1200" height="60" rx="10" fill="#d9770614" stroke="#d97706"/><text x="640" y="396" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">Observability: every box above emits a span (OpenTelemetry) → traces, cost, latency</text><rect x="40" y="436" width="1200" height="60" rx="10" fill="#7c3aed14" stroke="#7c3aed"/><text x="640" y="472" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">Evaluation: offline before release, online on sampled traces → scores and alerts</text><line x1="368" y1="292" x2="368" y2="358" stroke="#334155" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#a)"/><line x1="564" y1="292" x2="564" y2="358" stroke="#334155" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#a)"/><line x1="760" y1="292" x2="760" y2="358" stroke="#334155" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#a)"/><line x1="956" y1="292" x2="956" y2="358" stroke="#334155" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#a)"/><line x1="1152" y1="292" x2="1152" y2="358" stroke="#334155" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#a)"/></svg>