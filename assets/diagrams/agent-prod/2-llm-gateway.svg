<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1280" height="470" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">What an LLM gateway does</text><text x="24" y="56" font-size="13" fill="#475569">One endpoint for every model: keys, budgets, routing, fallbacks and logs in one place</text><rect x="40" y="90" width="220" height="70" rx="10" fill="#15803d14" stroke="#15803d" stroke-width="1.6"/><text x="150.0" y="130.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Research agent</text><rect x="40" y="190" width="220" height="70" rx="10" fill="#15803d14" stroke="#15803d" stroke-width="1.6"/><text x="150.0" y="230.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Action agent</text><rect x="40" y="290" width="220" height="70" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="1.6"/><text x="150.0" y="330.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Eval runner</text><rect x="470" y="120" width="300" height="220" rx="10" fill="#0369a114" stroke="#0369a1" stroke-width="1.6"/><text x="620.0" y="142" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">LLM gateway</text><text x="620.0" y="162" text-anchor="middle" font-size="12" fill="#334155">per-agent virtual keys</text><text x="620.0" y="178" text-anchor="middle" font-size="12" fill="#334155">budgets + rate limits</text><text x="620.0" y="194" text-anchor="middle" font-size="12" fill="#334155">routing by role</text><text x="620.0" y="210" text-anchor="middle" font-size="12" fill="#334155">fallback on errors</text><text x="620.0" y="226" text-anchor="middle" font-size="12" fill="#334155">caching</text><text x="620.0" y="242" text-anchor="middle" font-size="12" fill="#334155">spend + request logs</text><line x1="260" y1="125" x2="468" y2="125" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="260" y1="225" x2="468" y2="225" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="260" y1="325" x2="468" y2="300" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="990" y="90" width="250" height="70" rx="10" fill="#d9770614" stroke="#d97706" stroke-width="1.6"/><text x="1115.0" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Cloud model A</text><text x="1115.0" y="132" text-anchor="middle" font-size="12" fill="#334155">primary</text><line x1="770" y1="230" x2="988" y2="125" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="990" y="190" width="250" height="70" rx="10" fill="#d9770614" stroke="#d97706" stroke-width="1.6"/><text x="1115.0" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Cloud model B</text><text x="1115.0" y="232" text-anchor="middle" font-size="12" fill="#334155">fallback</text><line x1="770" y1="230" x2="988" y2="225" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="990" y="290" width="250" height="70" rx="10" fill="#d9770614" stroke="#d97706" stroke-width="1.6"/><text x="1115.0" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Self-hosted vLLM</text><text x="1115.0" y="332" text-anchor="middle" font-size="12" fill="#334155">cheap steps</text><line x1="770" y1="230" x2="988" y2="325" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><text x="40" y="440" font-size="13" fill="#334155" text-anchor="start">Self-hosted: LiteLLM, Portkey (open-source gateway). Hosted: OpenRouter, Portkey cloud, cloud vendors&#x27; own gateways.</text></svg>