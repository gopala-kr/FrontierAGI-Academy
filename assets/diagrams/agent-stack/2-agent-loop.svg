<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1280" height="420" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">The agent loop the stack serves</text><text x="24" y="56" font-size="13" fill="#475569">User → interface → framework → model → tools → memory, repeated until done; the runtime keeps long tasks durable</text><rect x="24" y="120" width="160" height="96" rx="10" fill="#64748b14" stroke="#64748b" stroke-width="1.6"/><text x="104.0" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">User</text><text x="104.0" y="162" text-anchor="middle" font-size="12" fill="#334155">asks or triggers</text><rect x="202" y="120" width="160" height="96" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="282.0" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Interface (06)</text><text x="282.0" y="162" text-anchor="middle" font-size="12" fill="#334155">chat, app, workspace</text><line x1="184" y1="168" x2="200" y2="168" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="380" y="120" width="160" height="96" rx="10" fill="#15803d14" stroke="#15803d" stroke-width="1.6"/><text x="460.0" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Framework (02)</text><text x="460.0" y="162" text-anchor="middle" font-size="12" fill="#334155">plans next step</text><line x1="362" y1="168" x2="378" y2="168" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="558" y="120" width="160" height="96" rx="10" fill="#d9770614" stroke="#d97706" stroke-width="1.6"/><text x="638.0" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Model (01)</text><text x="638.0" y="162" text-anchor="middle" font-size="12" fill="#334155">reasons, picks a tool</text><line x1="540" y1="168" x2="556" y2="168" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="736" y="120" width="160" height="96" rx="10" fill="#0891b214" stroke="#0891b2" stroke-width="1.6"/><text x="816.0" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Tools via MCP (03)</text><text x="816.0" y="162" text-anchor="middle" font-size="12" fill="#334155">acts in real systems</text><line x1="718" y1="168" x2="734" y2="168" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="914" y="120" width="160" height="96" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6"/><text x="994.0" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Memory (04)</text><text x="994.0" y="162" text-anchor="middle" font-size="12" fill="#334155">stores, recalls</text><line x1="896" y1="168" x2="912" y2="168" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="1092" y="120" width="160" height="96" rx="10" fill="#64748b14" stroke="#64748b" stroke-width="1.6"/><text x="1172.0" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Result</text><text x="1172.0" y="162" text-anchor="middle" font-size="12" fill="#334155">answer or finished task</text><line x1="1074" y1="168" x2="1090" y2="168" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><path d="M 1000 216 C 1000 330 470 330 470 218" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="735" y="330" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">loop until done — runtime (05) checkpoints each turn</text></svg>