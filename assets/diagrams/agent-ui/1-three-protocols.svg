<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1280" height="440" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Three protocols around one agent</text><text x="24" y="56" font-size="13" fill="#475569">MCP connects the agent to tools, A2A to other agents, AG-UI to the person on the screen</text><rect x="520" y="170" width="240" height="100" rx="10" fill="#15803d14" stroke="#15803d" stroke-width="1.6"/><text x="640.0" y="192" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Agent</text><text x="640.0" y="212" text-anchor="middle" font-size="12" fill="#334155">framework + model</text><rect x="60" y="170" width="260" height="100" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="190.0" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">User interface</text><text x="190.0" y="212" text-anchor="middle" font-size="12" fill="#334155">chat · app · workspace</text><line x1="320" y1="220" x2="518" y2="220" stroke="#334155" stroke-width="1.7" marker-end="url(#a)" marker-start="url(#a)"/><rect x="368.4" y="196" width="103.2" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="420" y="208" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">AG-UI (events)</text><rect x="960" y="90" width="260" height="90" rx="10" fill="#0891b214" stroke="#0891b2" stroke-width="1.6"/><text x="1090.0" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Tools &amp; data</text><text x="1090.0" y="132" text-anchor="middle" font-size="12" fill="#334155">MCP servers</text><line x1="760" y1="195" x2="958" y2="140" stroke="#334155" stroke-width="1.7" marker-end="url(#a)" marker-start="url(#a)"/><rect x="844.8" y="149.5" width="28.4" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="859.0" y="161.5" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">MCP</text><rect x="960" y="280" width="260" height="90" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="1.6"/><text x="1090.0" y="302" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Other agents</text><text x="1090.0" y="322" text-anchor="middle" font-size="12" fill="#334155">other teams / vendors</text><line x1="760" y1="245" x2="958" y2="320" stroke="#334155" stroke-width="1.7" marker-end="url(#a)" marker-start="url(#a)"/><rect x="844.8" y="264.5" width="28.4" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="859.0" y="276.5" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">A2A</text><text x="640" y="410" font-size="13" fill="#475569" text-anchor="middle">AG-UI is the newest of the three (2025) ⚠️; many apps still use a framework-specific stream instead.</text></svg>