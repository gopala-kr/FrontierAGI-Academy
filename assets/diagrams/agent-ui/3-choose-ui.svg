<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 430" width="1280" height="430" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1280" height="430" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Picking a UI toolkit</text><text x="24" y="56" font-size="13" fill="#475569">By who builds the screen and how much of it is the product</text><rect x="40" y="90" width="380" height="300" rx="10" fill="#d9770614" stroke="#d97706" stroke-width="1.6"/><text x="230.0" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Streamlit / Gradio</text><text x="230.0" y="132" text-anchor="middle" font-size="12" fill="#334155"> </text><text x="230" y="140" font-size="13" fill="#334155" text-anchor="middle">Python, minutes</text><text x="64" y="185" font-size="13" fill="#1e293b" text-anchor="start">• internal tools, demos</text><text x="64" y="213" font-size="13" fill="#1e293b" text-anchor="start">• data and ML teams</text><text x="64" y="241" font-size="13" fill="#1e293b" text-anchor="start">• limited custom UX</text><rect x="450" y="90" width="380" height="300" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="640.0" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Vercel AI SDK + assistant-ui</text><text x="640.0" y="132" text-anchor="middle" font-size="12" fill="#334155"> </text><text x="640" y="140" font-size="13" fill="#334155" text-anchor="middle">TypeScript / React</text><text x="474" y="185" font-size="13" fill="#1e293b" text-anchor="start">• your own chat product</text><text x="474" y="213" font-size="13" fill="#1e293b" text-anchor="start">• streaming, tool cards</text><text x="474" y="241" font-size="13" fill="#1e293b" text-anchor="start">• you own the design</text><rect x="860" y="90" width="380" height="300" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="1.6"/><text x="1050.0" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">CopilotKit (+ AG-UI)</text><text x="1050.0" y="132" text-anchor="middle" font-size="12" fill="#334155"> </text><text x="1050" y="140" font-size="13" fill="#334155" text-anchor="middle">React, agent-native</text><text x="884" y="185" font-size="13" fill="#1e293b" text-anchor="start">• agent inside an existing app</text><text x="884" y="213" font-size="13" fill="#1e293b" text-anchor="start">• shared state, approvals</text><text x="884" y="241" font-size="13" fill="#1e293b" text-anchor="start">• framework adapters</text></svg>