<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 258" width="1000" height="258" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1000" height="258" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Young workers in AI-exposed jobs: the gap is widening</text><text x="24" y="56" font-size="13" fill="#475569">Employment of 22–25-year-olds in the most AI-exposed jobs vs where it would be at their less-exposed peers’ pace</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><text x="24" y="114" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">Data to Jul 2025 (first paper)</text><rect class="gr" style="animation-delay:0.0s" x="330" y="96" width="348.0" height="28" rx="6" fill="#f59e0b"/><text x="686.0" y="116" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">15% below</text><text x="24" y="168" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">Data to Jun 2026 (Aug 2026 revision)</text><rect class="gr" style="animation-delay:0.15s" x="330" y="150" width="440.8" height="28" rx="6" fill="#dc2626"/><text x="778.8" y="170" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">19% below</text><text x="24" y="242" font-size="11.5" fill="#64748b" text-anchor="start">Source: Brynjolfsson, Chandar, Chen, Stanford Digital Economy Lab, ADP payroll data. Descriptive, not causal.</text></svg>