<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="1100" height="440" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1100" height="440" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">When thinking gets cheap, what stays scarce?</text><text x="24" y="56" font-size="13" fill="#475569">Our reading of where value moves</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="24" y="80" width="500" height="320" rx="12" fill="#16a34a0d" stroke="#16a34a" stroke-width="1.2"/><text x="36" y="100" font-size="12" font-weight="800" fill="#16a34a" letter-spacing=".5">GETTING CHEAP</text><rect x="576" y="80" width="500" height="320" rx="12" fill="#dc26260d" stroke="#dc2626" stroke-width="1.2"/><text x="588" y="100" font-size="12" font-weight="800" fill="#dc2626" letter-spacing=".5">STAYING SCARCE</text><g class="fd" style="animation-delay:0.0s"><rect x="44" y="110" width="460" height="44" rx="10" fill="#16a34a14" stroke="#16a34a" stroke-width="1.6"/><text x="274.0" y="137.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">A first draft of text or code</text></g><g class="fd" style="animation-delay:0.12s"><rect x="44" y="166" width="460" height="44" rx="10" fill="#16a34a14" stroke="#16a34a" stroke-width="1.6"/><text x="274.0" y="193.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">A summary of a document</text></g><g class="fd" style="animation-delay:0.24s"><rect x="44" y="222" width="460" height="44" rx="10" fill="#16a34a14" stroke="#16a34a" stroke-width="1.6"/><text x="274.0" y="249.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">A routine answer or classification</text></g><g class="fd" style="animation-delay:0.36s"><rect x="44" y="278" width="460" height="44" rx="10" fill="#16a34a14" stroke="#16a34a" stroke-width="1.6"/><text x="274.0" y="305.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">A translation</text></g><g class="fd" style="animation-delay:0.48s"><rect x="44" y="334" width="460" height="44" rx="10" fill="#16a34a14" stroke="#16a34a" stroke-width="1.6"/><text x="274.0" y="361.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">A standard analysis</text></g><g class="fd" style="animation-delay:0.6s"><rect x="596" y="110" width="460" height="44" rx="10" fill="#dc262614" stroke="#dc2626" stroke-width="1.6"/><text x="826.0" y="137.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Compute, power and chips</text></g><g class="fd" style="animation-delay:0.72s"><rect x="596" y="166" width="460" height="44" rx="10" fill="#dc262614" stroke="#dc2626" stroke-width="1.6"/><text x="826.0" y="193.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Trusted, proprietary data</text></g><g class="fd" style="animation-delay:0.84s"><rect x="596" y="222" width="460" height="44" rx="10" fill="#dc262614" stroke="#dc2626" stroke-width="1.6"/><text x="826.0" y="249.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Verification: knowing the answer is right</text></g><g class="fd" style="animation-delay:0.96s"><rect x="596" y="278" width="460" height="44" rx="10" fill="#dc262614" stroke="#dc2626" stroke-width="1.6"/><text x="826.0" y="305.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Distribution and customer trust</text></g><g class="fd" style="animation-delay:1.08s"><rect x="596" y="334" width="460" height="44" rx="10" fill="#dc262614" stroke="#dc2626" stroke-width="1.6"/><text x="826.0" y="361.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Judgement and accountability</text></g><line x1="530" y1="240" x2="570" y2="240" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/></svg>