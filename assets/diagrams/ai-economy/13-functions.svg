<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 312" width="1000" height="312" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1000" height="312" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Where firms put AI: business functions</text><text x="24" y="56" font-size="13" fill="#475569">Share of AI-using US firms using it in each function, Nov 2025 – Jan 2026</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><text x="24" y="114" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">Sales and marketing</text><rect class="gr" style="animation-delay:0.0s" x="330" y="96" width="502.7" height="28" rx="6" fill="#db2777"/><text x="840.6666666666667" y="116" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">52%</text><text x="24" y="168" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">Strategy and business development</text><rect class="gr" style="animation-delay:0.15s" x="330" y="150" width="435.0" height="28" rx="6" fill="#7c3aed"/><text x="773.0" y="170" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">45%</text><text x="24" y="222" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">Information technology</text><rect class="gr" style="animation-delay:0.3s" x="330" y="204" width="396.3" height="28" rx="6" fill="#2563eb"/><text x="734.3333333333333" y="224" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">41%</text><text x="24" y="296" font-size="11.5" fill="#64748b" text-anchor="start">Source: Bonney et al., The Microstructure of AI Diffusion (Census CES-WP-26-25 / NBER w35141). 57% of users integrate AI in three or fewer functions.</text></svg>