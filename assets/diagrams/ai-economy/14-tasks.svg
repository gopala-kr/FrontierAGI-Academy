<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 312" width="1000" height="312" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1000" height="312" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Which tasks workers use generative AI for</text><text x="24" y="56" font-size="13" fill="#475569">Generative AI adoption rate among workers who do each task (US, 2026)</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><text x="24" y="114" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">Reading documents for technical information</text><rect class="gr" style="animation-delay:0.0s" x="330" y="96" width="507.9" height="28" rx="6" fill="#0d9488"/><text x="845.9142857142857" y="116" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">61.3%</text><text x="24" y="168" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">Preparing research reports</text><rect class="gr" style="animation-delay:0.15s" x="330" y="150" width="502.9" height="28" rx="6" fill="#0891b2"/><text x="840.9428571428571" y="170" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">60.7%</text><text x="24" y="222" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">Analysing data for trends</text><rect class="gr" style="animation-delay:0.3s" x="330" y="204" width="476.4" height="28" rx="6" fill="#2563eb"/><text x="814.4285714285714" y="224" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">57.5%</text><text x="24" y="296" font-size="11.5" fill="#64748b" text-anchor="start">Source: Bick, Blandin, Deming and Schumacher, What Work Does Generative AI Do? (St. Louis Fed WP 2026-017). Lowest: manual and personal-service tasks.</text></svg>