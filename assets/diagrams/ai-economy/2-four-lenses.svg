<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="1100" height="360" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1100" height="360" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Four ways to measure &quot;AI is changing jobs&quot;</text><text x="24" y="56" font-size="13" fill="#475569">Each lens answers a different question; none of them alone is the answer</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="fd" style="animation-delay:0.0s"><rect x="24" y="86" width="248" height="112" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="1.6"/><text x="148.0" y="108" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Exposure</text><text x="148.0" y="128" text-anchor="middle" font-size="12" fill="#334155">Could AI do the tasks?</text><text x="148.0" y="144" text-anchor="middle" font-size="12" fill="#334155"></text><text x="148.0" y="160" text-anchor="middle" font-size="12" fill="#334155">Task lists × model ability</text></g><g class="fd" style="animation-delay:0.2s"><rect x="292" y="86" width="248" height="112" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="416.0" y="108" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Usage</text><text x="416.0" y="128" text-anchor="middle" font-size="12" fill="#334155">What do people use AI for?</text><text x="416.0" y="144" text-anchor="middle" font-size="12" fill="#334155"></text><text x="416.0" y="160" text-anchor="middle" font-size="12" fill="#334155">Anthropic Economic Index, Fed surveys</text></g><g class="fd" style="animation-delay:0.4s"><rect x="560" y="86" width="248" height="112" rx="10" fill="#dc262614" stroke="#dc2626" stroke-width="1.6"/><text x="684.0" y="108" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Payroll</text><text x="684.0" y="128" text-anchor="middle" font-size="12" fill="#334155">Who is being hired?</text><text x="684.0" y="144" text-anchor="middle" font-size="12" fill="#334155"></text><text x="684.0" y="160" text-anchor="middle" font-size="12" fill="#334155">ADP payroll (Stanford &quot;Canaries&quot;)</text></g><g class="fd" style="animation-delay:0.6000000000000001s"><rect x="828" y="86" width="248" height="112" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6"/><text x="952.0" y="108" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Occupation mix</text><text x="952.0" y="128" text-anchor="middle" font-size="12" fill="#334155">Is the job mix shifting?</text><text x="952.0" y="144" text-anchor="middle" font-size="12" fill="#334155"></text><text x="952.0" y="160" text-anchor="middle" font-size="12" fill="#334155">CPS (Yale Budget Lab)</text></g><rect x="24" y="226" width="1052" height="92" rx="10" fill="#0f172a14" stroke="#0f172a" stroke-width="1.6"/><text x="550.0" y="248" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">What they say together (Nov 2026)</text><text x="550.0" y="268" text-anchor="middle" font-size="12" fill="#334155">Usage is broad and growing; exposure is high in computer, office and finance work;</text><text x="550.0" y="284" text-anchor="middle" font-size="12" fill="#334155">hiring of young workers in exposed jobs has fallen; the overall job mix has not yet shifted in an AI-shaped way.</text></svg>