<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1000" height="330" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">How people use Claude.ai: helping vs doing</text><text x="24" y="56" font-size="13" fill="#475569">Share of conversations, Anthropic Economic Index</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><text x="24" y="122" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">Previous report</text><rect class="gr" x="330" y="100" width="282" height="34" rx="6" fill="#2563eb"/><text x="336" y="123" font-size="13" font-weight="700" fill="#fff">Augmentation 47%</text><rect class="gr" style="animation-delay:.3s" x="614" y="100" width="294" height="34" rx="6" fill="#f97316"/><text x="620" y="123" font-size="13" font-weight="700" fill="#fff">Automation 49%</text><text x="24" y="212" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">Jan 2026 report (Nov 2025 data)</text><rect class="gr" x="330" y="190" width="312" height="34" rx="6" fill="#2563eb"/><text x="336" y="213" font-size="13" font-weight="700" fill="#fff">Augmentation 52%</text><rect class="gr" style="animation-delay:.3s" x="644" y="190" width="270" height="34" rx="6" fill="#f97316"/><text x="650" y="213" font-size="13" font-weight="700" fill="#fff">Automation 45%</text><text x="24" y="300" font-size="11.5" fill="#64748b" text-anchor="start">Augmentation = the person works with the AI; automation = the AI does the task. Previous-report values derived from the stated changes (+5 / −4 points).</text></svg>