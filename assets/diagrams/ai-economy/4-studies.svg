<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1100" height="470" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">What the controlled studies found</text><text x="24" y="56" font-size="13" fill="#475569">Change in output per hour (or time taken), by study; bars from zero</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><line x1="560" y1="80" x2="560" y2="400" stroke="#334155" stroke-width="1.5"/><text x="560" y="76" font-size="12" fill="#334155" text-anchor="middle">0</text><text x="24" y="120" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">Customer support, all agents (QJE 2025)</text><rect class="gr" style="animation-delay:0.0s;transform-origin:left center" x="560" y="102" width="168" height="26" rx="5" fill="#16a34a"/><text x="736" y="121" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700">+14% issues/hour</text><text x="24" y="178" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">Customer support, novice agents</text><rect class="gr" style="animation-delay:0.15s;transform-origin:left center" x="560" y="160" width="408" height="26" rx="5" fill="#16a34a"/><text x="976" y="179" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700">+34%</text><text x="24" y="236" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">Experienced OSS developers, early 2025 (METR)</text><rect class="gr" style="animation-delay:0.3s;transform-origin:right center" x="332" y="218" width="228" height="26" rx="5" fill="#dc2626"/><text x="568" y="237" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700">19% slower</text><text x="24" y="294" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">Same developers: how fast they felt</text><rect class="gr" style="animation-delay:0.44999999999999996s;transform-origin:left center" x="560" y="276" width="240" height="26" rx="5" fill="#94a3b8"/><text x="808" y="295" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700">felt +20% faster</text><text x="24" y="352" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">Gen AI users: time saved (St. Louis Fed, 2024)</text><rect class="gr" style="animation-delay:0.6s;transform-origin:left center" x="560" y="334" width="64.80000000000001" height="26" rx="5" fill="#2563eb"/><text x="632.8" y="353" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700">5.4% of hours</text><text x="24" y="440" font-size="11.5" fill="#64748b" text-anchor="start">Different measures and settings: compare directions, not sizes. Sources: Brynjolfsson, Li &amp; Raymond (QJE 2025); METR (arXiv 2507.09089); St. Louis Fed.</text></svg>