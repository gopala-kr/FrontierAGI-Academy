<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1000" height="400" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">US labour productivity, 2026</text><text x="24" y="56" font-size="13" fill="#475569">Nonfarm business output per hour, % change (quarterly figures annualised)</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect class="gu" style="animation-delay:0.0s" x="140" y="214.5" width="140" height="115.5" rx="6" fill="#64748b"/><text x="210" y="204.5" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="700">2.1%</text><text x="210" y="354" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">Q2 2026 (revised)</text><rect class="gu" style="animation-delay:0.2s" x="410" y="132.0" width="140" height="198.0" rx="6" fill="#2563eb"/><text x="480" y="122.0" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="700">3.6%</text><text x="480" y="354" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">Q3 2026</text><rect class="gu" style="animation-delay:0.4s" x="680" y="214.5" width="140" height="115.5" rx="6" fill="#0d9488"/><text x="750" y="204.5" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="700">2.1%</text><text x="750" y="354" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">Q3 2026 vs Q3 2025</text><line x1="100" y1="330" x2="960" y2="330" stroke="#334155"/><text x="24" y="385" font-size="11.5" fill="#64748b" text-anchor="start">Source: BLS Productivity and Costs, 5 Nov 2026. BLS does not attribute any of this to AI.</text></svg>