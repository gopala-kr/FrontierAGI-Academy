<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1000" height="420" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">The productivity J-curve (illustrative)</text><text x="24" y="56" font-size="13" fill="#475569">Why firm-wide gains can lag behind task-level gains</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><line x1="80" y1="240" x2="940" y2="240" stroke="#94a3b8" stroke-dasharray="5 4"/><text x="84" y="232" font-size="12" fill="#64748b" text-anchor="start">no change</text><path class="dr" d="M80 240 C 220 245, 280 320, 380 315 S 560 250, 640 200 S 820 110, 940 90" fill="none" stroke="#2563eb" stroke-width="4"/><text x="300" y="345" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">1. Invest: tools, training, redesign. Measured output dips.</text><text x="560" y="280" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">2. Reorganise work around AI.</text><text x="760" y="120" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">3. Gains show up in the statistics.</text><text x="24" y="400" font-size="11.5" fill="#64748b" text-anchor="start">Shape is illustrative (after Brynjolfsson, Rock &amp; Syverson’s productivity J-curve idea); not fitted to data.</text></svg>