<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1000" height="420" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">US businesses using AI, by sector</text><text x="24" y="56" font-size="13" fill="#475569">Share of firms using AI in any business function, Census Business Trends and Outlook Survey, as of 3 May 2026</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><text x="24" y="114" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">Information</text><rect class="gr" style="animation-delay:0.0s" x="330" y="96" width="460.5" height="28" rx="6" fill="#7c3aed"/><text x="798.52" y="116" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">39.7% now</text><text x="24" y="168" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">Information, expected in 6 months</text><rect class="gr" style="animation-delay:0.15s" x="330" y="150" width="487.2" height="28" rx="6" fill="#c4b5fd"/><text x="825.2" y="170" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">42% approx.</text><text x="24" y="222" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">Finance and insurance</text><rect class="gr" style="animation-delay:0.3s" x="330" y="204" width="393.2" height="28" rx="6" fill="#2563eb"/><text x="731.24" y="224" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">33.9% now</text><text x="24" y="276" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">Finance, expected in 6 months</text><rect class="gr" style="animation-delay:0.44999999999999996s" x="330" y="258" width="452.4" height="28" rx="6" fill="#93c5fd"/><text x="790.4" y="278" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">39% approx.</text><text x="24" y="330" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">All US businesses</text><rect class="gr" style="animation-delay:0.6s" x="330" y="312" width="229.7" height="28" rx="6" fill="#0f172a"/><text x="567.6800000000001" y="332" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">19.8% now</text><text x="24" y="404" font-size="11.5" fill="#64748b" text-anchor="start">Source: US Census Bureau BTOS (question broadened Nov 2025; earlier figures not comparable). Six-month expectations as reported, rounded.</text></svg>