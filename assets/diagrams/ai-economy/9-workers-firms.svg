<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1000" height="420" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Workers vs firms: two different adoption numbers</text><text x="24" y="56" font-size="13" fill="#475569">Why &quot;45% use AI&quot; and &quot;20% use AI&quot; can both be true</text><style>.gr{animation:gr 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}.gu{animation:gu 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center bottom}.fd{animation:fd 1s ease-out both}.dr{stroke-dasharray:1600;animation:dr 2.4s ease-out both}@keyframes gr{from{transform:scaleX(0)}}@keyframes gu{from{transform:scaleY(0)}}@keyframes fd{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1600}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><text x="24" y="114" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">Workers using AI for their job (May 2026)</text><rect class="gr" style="animation-delay:0.0s" x="330" y="96" width="522.0" height="28" rx="6" fill="#2563eb"/><text x="860.0" y="116" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">45%</text><text x="24" y="168" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">Employed adults, used gen AI for work last week (Q2 2026)</text><rect class="gr" style="animation-delay:0.15s" x="330" y="150" width="454.7" height="28" rx="6" fill="#60a5fa"/><text x="792.72" y="170" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">39.2%</text><text x="24" y="222" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">Large firms scaling AI agents (2026)</text><rect class="gr" style="animation-delay:0.3s" x="330" y="204" width="464.0" height="28" rx="6" fill="#7c3aed"/><text x="802.0" y="224" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">40%</text><text x="24" y="276" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">Smaller firms scaling AI agents (2026)</text><rect class="gr" style="animation-delay:0.44999999999999996s" x="330" y="258" width="255.2" height="28" rx="6" fill="#c4b5fd"/><text x="593.2" y="278" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">22%</text><text x="24" y="330" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">US businesses using AI (May 2026)</text><rect class="gr" style="animation-delay:0.6s" x="330" y="312" width="229.7" height="28" rx="6" fill="#0f172a"/><text x="567.6800000000001" y="332" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">19.8%</text><text x="24" y="404" font-size="11.5" fill="#64748b" text-anchor="start">Sources: St. Louis Fed; McKinsey State of AI 2026 (survey respondents, &gt;$1B revenue = large); Census BTOS.</text></svg>