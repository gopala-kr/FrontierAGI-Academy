<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1280" height="560" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">How the agent reaches the outside world on AWS</text><text x="24" y="56" font-size="13" fill="#475569">Every tool call leaves through AgentCore Gateway (MCP), then fans out to Lambda, APIs, managed sandboxes and AWS services</text><rect x="40" y="200" width="200" height="90" rx="10" fill="#9333ea14" stroke="#9333ea" stroke-width="1.6"/><text x="140.0" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Agent (Strands)</text><text x="140.0" y="242" text-anchor="middle" font-size="12" fill="#334155">tool decision</text><rect x="300" y="200" width="190" height="90" rx="10" fill="#0891b214" stroke="#0891b2" stroke-width="1.6"/><text x="395.0" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">MCP client</text><text x="395.0" y="242" text-anchor="middle" font-size="12" fill="#334155">lists tools · calls</text><line x1="240" y1="245" x2="298" y2="245" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="215.0" y="220" width="110.0" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="270" y="232" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">call(name,args)</text><rect x="550" y="190" width="200" height="110" rx="10" fill="#dc262614" stroke="#dc2626" stroke-width="1.6"/><text x="650.0" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">AgentCore Gateway</text><text x="650.0" y="232" text-anchor="middle" font-size="12" fill="#334155">identity · policy · limits</text><line x1="490" y1="245" x2="548" y2="245" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="491.2" y="220" width="55.6" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="519" y="232" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">request</text><line x1="750" y1="215" x2="880" y2="120" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="750" y1="235" x2="880" y2="230" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="750" y1="255" x2="880" y2="340" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="750" y1="275" x2="880" y2="450" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="882" y="80" width="360" height="80" rx="10" fill="#0891b214" stroke="#0891b2" stroke-width="1.6"/><text x="1062.0" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Lambda functions</text><text x="1062.0" y="122" text-anchor="middle" font-size="12" fill="#334155">your business logic as tools</text><rect x="882" y="190" width="360" height="80" rx="10" fill="#0891b214" stroke="#0891b2" stroke-width="1.6"/><text x="1062.0" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">OpenAPI / API Gateway targets</text><text x="1062.0" y="232" text-anchor="middle" font-size="12" fill="#334155">existing internal + external APIs</text><rect x="882" y="300" width="360" height="80" rx="10" fill="#0891b214" stroke="#0891b2" stroke-width="1.6"/><text x="1062.0" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">AgentCore Browser + Code Interpreter</text><text x="1062.0" y="342" text-anchor="middle" font-size="12" fill="#334155">managed, isolated sandboxes</text><rect x="882" y="410" width="360" height="80" rx="10" fill="#0891b214" stroke="#0891b2" stroke-width="1.6"/><text x="1062.0" y="432" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Other MCP servers</text><text x="1062.0" y="452" text-anchor="middle" font-size="12" fill="#334155">AWS services + third-party tools</text><rect x="550" y="360" width="200" height="80" rx="10" fill="#dc262614" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 4"/><text x="650.0" y="382" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Denied</text><text x="650.0" y="402" text-anchor="middle" font-size="12" fill="#334155">logged, agent told why</text><line x1="650" y1="300" x2="650" y2="358" stroke="#dc2626" stroke-width="1.7" marker-end="url(#r)"/><rect x="648.4" y="320" width="103.2" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="700" y="332" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">policy says no</text><text x="40" y="520" font-size="13" fill="#1e293b" text-anchor="start">Why one door: identity, rate limits, policy and audit live in the gateway. Tools added later inherit the same checks without touching agent code.</text></svg>