start">110 ms</text><text x="46" y="242" font-size="12" fill="#0f172a" text-anchor="start">analysis: decide (model call)</text><rect x="823.9069767441861" y="229" width="318.13953488372096" height="18" rx="3" fill="#d97706"/><text x="1148.046511627907" y="242" font-size="11" fill="#475569" text-anchor="start">380 ms</text><text x="46" y="276" font-size="12" fill="#0f172a" text-anchor="start">action: refunded</text><rect x="1142.046511627907" y="263" width="50.23255813953489" height="18" rx="3" fill="#2563eb"/><text x="1180" y="276" font-size="11" fill="#475569" text-anchor="start">60 ms</text><text x="46" y="310" font-size="12" fill="#0f172a" text-anchor="start">gateway: denied research write</text><rect x="1192.2790697674418" y="297" width="3" height="18" rx="3" fill="#dc2626"/><text x="1180" y="310" font-size="11" fill="#475569" text-anchor="start">2 ms</text><text x="30" y="344" font-size="12" fill="#0f172a" text-anchor="start">content safety out: pass</text><rect x="1193.953488372093" y="331" width="33.48837209302326" height="18" rx="3" fill="#2563eb"/><text x="1180" y="344" font-size="11" fill="#475569" text-anchor="start">40 ms</text><text x="30" y="378" font-size="12" fill="#0f172a" text-anchor="start">thread + memory write</text><rect x="1227.4418604651164" y="365" width="12.558139534883722" height="18" rx="3" fill="#2563eb"/><text x="1180" y="378" font-size="11" fill="#475569" text-anchor="start">15 ms</text><text x="340" y="402" font-size="11" fill="#64748b" text-anchor="start">0 ms</text><text x="1240" y="402" font-size="11" fill="#64748b" text-anchor="end">1,075 ms</text><text x="30" y="435" font-size="12" fill="#475569" text-anchor="start">orange = model calls (most of the time)   red = blocked call</text></svg>