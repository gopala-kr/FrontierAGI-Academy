<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1280" height="470" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Where the agent itself runs on Azure: three hosting choices</text><text x="24" y="56" font-size="13" fill="#475569">Same Agent Framework code; the difference is who operates the servers and how much you can tune</text><rect x="40" y="90" width="380" height="300" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="1.6"/><text x="230.0" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Foundry Agent Service</text><text x="230.0" y="132" text-anchor="middle" font-size="12" fill="#334155"> </text><text x="230" y="140" font-size="13" fill="#334155" text-anchor="middle">Microsoft runs it</text><text x="64" y="185" font-size="13" fill="#1e293b" text-anchor="start">• hosted agents, threads built in</text><text x="64" y="213" font-size="13" fill="#1e293b" text-anchor="start">• identity, tools + evals wired in</text><text x="64" y="241" font-size="13" fill="#1e293b" text-anchor="start">• least ops, least control</text><rect x="64" y="300" width="99.6" height="14" rx="7" fill="#7c3aed"/><text x="64" y="340" font-size="12" fill="#475569" text-anchor="start">ops you own</text><rect x="450" y="90" width="380" height="300" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="640.0" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Container Apps</text><text x="640.0" y="132" text-anchor="middle" font-size="12" fill="#334155"> </text><text x="640" y="140" font-size="13" fill="#334155" text-anchor="middle">serverless containers</text><text x="474" y="185" font-size="13" fill="#1e293b" text-anchor="start">• you ship an image</text><text x="474" y="213" font-size="13" fill="#1e293b" text-anchor="start">• scale to zero, per-use billing</text><text x="474" y="241" font-size="13" fill="#1e293b" text-anchor="start">• you wire sessions &amp; memory</text><rect x="474" y="300" width="215.79999999999998" height="14" rx="7" fill="#2563eb"/><text x="474" y="340" font-size="12" fill="#475569" text-anchor="start">ops you own</text><rect x="860" y="90" width="380" height="300" rx="10" fill="#47556914" stroke="#475569" stroke-width="1.6"/><text x="1050.0" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">AKS</text><text x="1050.0" y="132" text-anchor="middle" font-size="12" fill="#334155"> </text><text x="1050" y="140" font-size="13" fill="#334155" text-anchor="middle">Kubernetes</text><text x="884" y="185" font-size="13" fill="#1e293b" text-anchor="start">• you run the cluster</text><text x="884" y="213" font-size="13" fill="#1e293b" text-anchor="start">• GPUs for vLLM self-hosting</text><text x="884" y="241" font-size="13" fill="#1e293b" text-anchor="start">• most control, most ops</text><rect x="884" y="300" width="332.0" height="14" rx="7" fill="#475569"/><text x="884" y="340" font-size="12" fill="#475569" text-anchor="start">ops you own</text></svg>