<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1280" height="560" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Which blueprint? A four-question chooser</text><text x="24" y="56" font-size="13" fill="#475569">Our rule of thumb, not a law: start at the top, stop at the first yes</text><rect x="40" y="90" width="700" height="70" rx="10" fill="#47556914" stroke="#475569" stroke-width="1.6"/><text x="390.0" y="130.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Must data stay on hardware you control (air-gap, strict residency)?</text><line x1="740" y1="125" x2="860" y2="125" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="785.8" y="107.0" width="28.4" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="800.0" y="119.0" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">yes</text><rect x="862" y="90" width="380" height="70" rx="10" fill="#16a34a14" stroke="#16a34a" stroke-width="1.6"/><text x="1052.0" y="130.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Open-source, self-hosted (Part 4)</text><line x1="390" y1="160" x2="390" y2="190" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="399.2" y="168" width="21.6" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="410" y="180" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">no</text><rect x="40" y="190" width="700" height="70" rx="10" fill="#47556914" stroke="#475569" stroke-width="1.6"/><text x="390.0" y="230.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Do your users sign in with Entra ID and work in Microsoft 365?</text><line x1="740" y1="225" x2="860" y2="225" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="785.8" y="207.0" width="28.4" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="800.0" y="219.0" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">yes</text><rect x="862" y="190" width="380" height="70" rx="10" fill="#0284c714" stroke="#0284c7" stroke-width="1.6"/><text x="1052.0" y="230.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Azure (Part 3)</text><line x1="390" y1="260" x2="390" y2="290" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="399.2" y="268" width="21.6" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="410" y="280" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">no</text><rect x="40" y="290" width="700" height="70" rx="10" fill="#47556914" stroke="#475569" stroke-width="1.6"/><text x="390.0" y="330.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Are your data and security tooling already mostly on AWS?</text><line x1="740" y1="325" x2="860" y2="325" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="785.8" y="307.0" width="28.4" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="800.0" y="319.0" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">yes</text><rect x="862" y="290" width="380" height="70" rx="10" fill="#ea580c14" stroke="#ea580c" stroke-width="1.6"/><text x="1052.0" y="330.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">AWS (Part 2)</text><line x1="390" y1="360" x2="390" y2="390" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="399.2" y="368" width="21.6" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="410" y="380" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">no</text><rect x="40" y="390" width="700" height="70" rx="10" fill="#47556914" stroke="#475569" stroke-width="1.6"/><text x="390.0" y="430.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Is your data in BigQuery / Workspace, or do you want Gemini first?</text><line x1="740" y1="425" x2="860" y2="425" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="785.8" y="407.0" width="28.4" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="800.0" y="419.0" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">yes</text><rect x="862" y="390" width="380" height="70" rx="10" fill="#2563eb14" stroke="#2563eb" stroke-width="1.6"/><text x="1052.0" y="430.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Google Cloud (Part 1)</text><rect x="40" y="490" width="1200" height="50" rx="10" fill="#64748b14" stroke="#64748b" stroke-width="1.6"/><text x="640.0" y="520.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">No clear yes? Pick the cloud you already pay for, and keep the portable pieces (open SDK, MCP, OpenTelemetry) so you can move later.</text></svg>