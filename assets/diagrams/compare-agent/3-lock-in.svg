<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" width="1280" height="500" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1280" height="500" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">What moves with you, and what does not</text><text x="24" y="56" font-size="13" fill="#475569">Lock-in by layer: green pieces move between all four blueprints; red pieces are rewritten if you switch</text><rect x="40" y="80" width="300" height="34" rx="8" fill="#16a34a22" stroke="#16a34a"/><text x="54" y="102" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">Agent logic (prompts, graphs)</text><text x="660" y="102" font-size="12" fill="#334155" text-anchor="start">portable SDKs: ADK, Strands, Agent Fwk, LangGraph all open</text><rect x="40" y="124" width="300" height="34" rx="8" fill="#16a34a22" stroke="#16a34a"/><text x="54" y="146" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">Tools over MCP</text><text x="660" y="146" font-size="12" fill="#334155" text-anchor="start">same MCP servers work everywhere</text><rect x="40" y="168" width="300" height="34" rx="8" fill="#16a34a22" stroke="#16a34a"/><text x="54" y="190" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">Traces (OpenTelemetry)</text><text x="660" y="190" font-size="12" fill="#334155" text-anchor="start">same instrumentation, new backend</text><rect x="40" y="212" width="300" height="34" rx="8" fill="#16a34a22" stroke="#16a34a"/><text x="54" y="234" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">Evals (golden sets)</text><text x="660" y="234" font-size="12" fill="#334155" text-anchor="start">data is yours; runner swappable</text><rect x="40" y="256" width="450" height="34" rx="8" fill="#d9770622" stroke="#d97706"/><text x="54" y="278" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">Records (Postgres-compatible)</text><text x="660" y="278" font-size="12" fill="#334155" text-anchor="start">AlloyDB / Aurora / Azure PG / Postgres</text><rect x="40" y="300" width="600" height="34" rx="8" fill="#dc262622" stroke="#dc2626"/><text x="54" y="322" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">Agent memory services</text><text x="660" y="322" font-size="12" fill="#334155" text-anchor="start">Memory Bank, AgentCore Memory, Foundry Memory differ</text><rect x="40" y="344" width="600" height="34" rx="8" fill="#dc262622" stroke="#dc2626"/><text x="54" y="366" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">Content filters</text><text x="660" y="366" font-size="12" fill="#334155" text-anchor="start">Model Armor / Guardrails / Prompt Shields configs differ</text><rect x="40" y="388" width="600" height="34" rx="8" fill="#dc262622" stroke="#dc2626"/><text x="54" y="410" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">Identity + policy</text><text x="660" y="410" font-size="12" fill="#334155" text-anchor="start">IAM, Cognito, Entra, OPA rules rewritten</text><rect x="40" y="432" width="600" height="34" rx="8" fill="#dc262622" stroke="#dc2626"/><text x="54" y="454" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">Managed agent runtime</text><text x="660" y="454" font-size="12" fill="#334155" text-anchor="start">Agent Engine / AgentCore / Foundry APIs differ</text><text x="40" y="486" font-size="12" fill="#475569" text-anchor="start">Bar length = rough effort to move (our judgement). Design tip: keep the green layers clean and the red ones thin.</text></svg>