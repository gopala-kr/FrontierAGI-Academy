<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1280" height="520" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Per-token cloud vs self-hosted: where the lines cross</text><text x="24" y="56" font-size="13" fill="#475569">Our model with the example inputs from Parts 1–4: cloud ≈ $0.0312 per task; self-hosted ≈ $93,633 per month fixed (4 GPUs, 4 engineers)</text><line x1="110" y1="450" x2="1210" y2="450" stroke="#94a3b8"/><line x1="110" y1="450" x2="110" y2="110" stroke="#94a3b8"/><text x="110.0" y="470" font-size="12" fill="#475569" text-anchor="middle">0M</text><text x="330.0" y="470" font-size="12" fill="#475569" text-anchor="middle">1M</text><text x="550.0" y="470" font-size="12" fill="#475569" text-anchor="middle">2M</text><text x="770.0" y="470" font-size="12" fill="#475569" text-anchor="middle">3M</text><text x="990.0" y="470" font-size="12" fill="#475569" text-anchor="middle">4M</text><text x="1210.0" y="470" font-size="12" fill="#475569" text-anchor="middle">5M</text><text x="102" y="454.0" font-size="12" fill="#475569" text-anchor="end">$0k</text><text x="102" y="369.0" font-size="12" fill="#475569" text-anchor="end">$50k</text><text x="102" y="284.0" font-size="12" fill="#475569" text-anchor="end">$100k</text><text x="102" y="199.0" font-size="12" fill="#475569" text-anchor="end">$150k</text><text x="102" y="114.0" font-size="12" fill="#475569" text-anchor="end">$200k</text><text x="660.0" y="494" font-size="12" fill="#334155" text-anchor="middle">tasks per month<