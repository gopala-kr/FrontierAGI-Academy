<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1280" height="520" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Three ways agents talk to each other</text><text x="24" y="56" font-size="13" fill="#475569">Same planner and sub-agents; what changes is the channel — and with it latency, coupling and failure handling</text><rect x="30" y="80" width="395" height="420" rx="12" fill="#9333ea0d" stroke="#9333ea" stroke-width="1.2"/><text x="42" y="100" font-size="12" font-weight="800" fill="#9333ea" letter-spacing=".5">ADK DELEGATION</text><text x="44" y="122" font-size="13" fill="#334155" text-anchor="start">in one process</text><rect x="155" y="140" width="145" height="52" rx="10" fill="#9333ea14" stroke="#9333ea" stroke-width="1.6"/><text x="227.5" y="171.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Planner</text><rect x="50" y="215" width="355" height="110" rx="10" fill="none" stroke="#94a3b8" stroke-dasharray="5 4"/><text x="60" y="232" font-size="11" fill="#64748b" text-anchor="start">one container / Agent Runtime instance</text><rect x="62" y="250" width="100" height="52" rx="10" fill="#9333ea14" stroke="#9333ea" stroke-width="1.6"/><text x="112.0" y="281.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Research</text><line x1="227" y1="192" x2="112" y2="248" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="177" y="250" width="100" height="52" rx="10" fill="#9333ea14" stroke="#9333ea" stroke-width="1.6"/><text x="227.0" y="281.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Analysis</text><line x1="227" y1="192" x2="227" y2="248" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="292" y="250" width="100" height="52" rx="10" fill="#9333ea14" stroke="#9333ea" stroke-width="1.6"/><text x="342.0" y="281.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Action</text><line x1="227" y1="192" x2="342" y2="248" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><text x="330" y="165" font-size="12" fill="#475569" text-anchor="middle">function call</text><text x="50" y="400" font-size="13" fill="#1e293b" text-anchor="start">• planner calls sub-agent like a function</text><text x="50" y="422" font-size="13" fill="#1e293b" text-anchor="start">• shared session state</text><text x="50" y="444" font-size="13" fill="#1e293b" text-anchor="start">• fast: no network hop</text><text x="50" y="466" font-size="13" fill="#1e293b" text-anchor="start">• one deploy, one failure domain</text><rect x="445" y="80" width="395" height="420" rx="12" fill="#7c3aed0d" stroke="#7c3aed" stroke-width="1.2"/><text x="457" y="100" font-size="12" font-weight="800" fill="#7c3aed" letter-spacing=".5">A2A PROTOCOL</text><text x="459" y="122" font-size="13" fill="#334155" text-anchor="start">agent ↔ agent over HTTP</text><rect x="570" y="140" width="145" height="52" rx="10" fill="#9333ea14" stroke="#9333ea" stroke-width="1.6"/><text x="642.5" y="171.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Planner</text><rect x="465" y="262" width="110" height="56" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="1.6"/><text x="520.0" y="295.0" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Research svc</text><line x1="642" y1="192" x2="520" y2="260" stroke="#334155" stroke-width="1.7" marker-end="url(#a)" marker-start="url(#a)"/><rect x="590" y="262" width="110" height="56" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="1.6"/><text x="645.0" y="295.0" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Analysis svc</text><line x1="642" y1="192" x2="645" y2="260" stroke="#334155" stroke-width="1.7" marker-end="url(#a)" marker-start="url(#a)"/><rect x="715" y="262" width="110" height="56" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="1.6"/><text x="770.0" y="295.0" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Action svc</text><line x1="642" y1="192" x2="770" y2="260" stroke="#334155" stroke-width="1.7" marker-end="url(#a)" marker-start="url(#a)"/><text x="642" y="350" font-size="12" fill="#475569" text-anchor="middle">HTTPS + agent card + auth</text><text x="465" y="400" font-size="13" fill="#1e293b" text-anchor="start">• each agent is its own service</text><text x="465" y="422" font-size="13" fill="#1e293b" text-anchor="start">• discovers peers by agent card</text><text x="465" y="444" font-size="13" fill="#1e293b" text-anchor="start">• teams deploy independently</text><text x="465" y="466" font-size="13" fill="#1e293b" text-anchor="start">• network hop + auth on every call</text><rect x="860" y="80" width="395" height="420" rx="12" fill="#0891b20d" stroke="#0891b2" stroke-width="1.2"/><text x="872" y="100" font-size="12" font-weight="800" fill="#0891b2" letter-spacing=".5">PUB/SUB</text><text x="874" y="122" font-size="13" fill="#334155" text-anchor="start">events, asynchronous</text><rect x="985" y="140" width="145" height="52" rx="10" fill="#9333ea14" stroke="#9333ea" stroke-width="1.6"/><text x="1057.5" y="171.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Planner</text><rect x="950" y="228" width="215" height="40" rx="10" fill="#0891b214" stroke="#0891b2" stroke-width="1.6"/><text x="1057.5" y="253.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">topic: tasks</text><line x1="1057" y1="192" x2="1057" y2="226" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="1067.2" y="200" width="55.6" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="1095" y="212" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">publish</text><rect x="892" y="300" width="100" height="44" rx="10" fill="#0891b214" stroke="#0891b2" stroke-width="1.6"/><text x="942.0" y="327.0" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Worker A</text><line x1="1057" y1="268" x2="942" y2="298" stroke="#334155" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#a)"/><rect x="1007" y="300" width="100" height="44" rx="10" fill="#0891b214" stroke="#0891b2" stroke-width="1.6"/><text x="1057.0" y="327.0" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Worker B</text><line x1="1057" y1="268" x2="1057" y2="298" stroke="#334155" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#a)"/><rect x="1122" y="300" width="100" height="44" rx="10" fill="#0891b214" stroke="#0891b2" stroke-width="1.6"/><text x="1172.0" y="327.0" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Worker C</text><line x1="1057" y1="268" x2="1172" y2="298" stroke="#334155" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="1057" y="362" font-size="12" fill="#475569" text-anchor="middle">results → topic: done (or callback)</text><text x="880" y="400" font-size="13" fill="#1e293b" text-anchor="start">• planner publishes a task, moves on</text><text x="880" y="422" font-size="13" fill="#1e293b" text-anchor="start">• workers pick up when ready</text><text x="880" y="444" font-size="13" fill="#1e293b" text-anchor="start">• retries + dead-letter for free</text><text x="880" y="466" font-size="13" fill="#1e293b" text-anchor="start">• no immediate answer; needs correlation</text></svg>