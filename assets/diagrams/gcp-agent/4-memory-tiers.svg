<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1280" height="520" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Where an agent keeps what it knows</text><text x="24" y="56" font-size="13" fill="#475569">Four stores, chosen by how long a fact must live and how fast it must be read (indicative, not measured)</text><rect x="40" y="110" width="280" height="250" rx="10" fill="#47556914" stroke="#475569" stroke-width="1.6"/><text x="180.0" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Memorystore (Redis)</text><text x="180.0" y="152" text-anchor="middle" font-size="12" fill="#334155"> </text><text x="180" y="170" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">lives: seconds–minutes</text><text x="180" y="195" font-size="12" fill="#334155" text-anchor="middle">scratch state, locks, rate counters</text><text x="180" y="222" font-size="12" fill="#334155" text-anchor="middle">sub-ms reads</text><rect x="345" y="110" width="280" height="250" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6"/><text x="485.0" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Sessions</text><text x="485.0" y="152" text-anchor="middle" font-size="12" fill="#334155"> </text><text x="485" y="170" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">lives: one conversation</text><text x="485" y="195" font-size="12" fill="#334155" text-anchor="middle">turns, tool results, working state</text><text x="485" y="222" font-size="12" fill="#334155" text-anchor="middle">read every turn</text><rect x="650" y="110" width="280" height="250" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6"/><text x="790.0" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Memory Bank</text><text x="790.0" y="152" text-anchor="middle" font-size="12" fill="#334155"> </text><text x="790" y="170" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">lives: weeks–months</text><text x="790" y="195" font-size="12" fill="#334155" text-anchor="middle">extracted facts &amp; preferences</text><text x="790" y="222" font-size="12" fill="#334155" text-anchor="middle">retrieved by relevance</text><rect x="955" y="110" width="280" height="250" rx="10" fill="#0891b214" stroke="#0891b2" stroke-width="1.6"/><text x="1095.0" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Firestore / Cloud SQL / AlloyDB</text><text x="1095.0" y="152" text-anchor="middle" font-size="12" fill="#334155"> </text><text x="1095" y="170" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">lives: years (system of record)</text><text x="1095" y="195" font-size="12" fill="#334155" text-anchor="middle">orders, customers, refunds</text><text x="1095" y="222" font-size="12" fill="#334155" text-anchor="middle">queried via tools</text><line x1="60" y1="400" x2="1220" y2="400" stroke="#475569" stroke-width="1.7" marker-end="url(#a)"/><rect x="469.4" y="380" width="341.2" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="640" y="392" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">longer life → slower, more durable, more governed</text><text x="40" y="450" font-size="13" fill="#1e293b" text-anchor="start">Rule of thumb: the model sees a summary of Sessions + the top few Memory Bank facts each turn; business truth is never &quot;remembered&quot; — it is re-read from the database through a tool.</text><text x="40" y="474" font-size="13" fill="#1e293b" text-anchor="start">Writes go the other way: the session is appended every turn; facts are extracted to Memory Bank after a conversation; the action agent writes the database only through the gateway.</text></svg>