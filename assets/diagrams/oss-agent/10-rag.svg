<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1280" height="470" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Knowledge (RAG): grounding answers in your documents</text><text x="24" y="56" font-size="13" fill="#475569">Optional in the blueprint, used here for the refund policy: index once, retrieve on every relevant turn</text><rect x="20" y="80" width="600" height="330" rx="12" fill="#4755690d" stroke="#475569" stroke-width="1.2"/><text x="32" y="100" font-size="12" font-weight="800" fill="#475569" letter-spacing=".5">INDEXING (offline, when documents change)</text><rect x="40" y="150" width="175" height="90" rx="10" fill="#47556914" stroke="#475569" stroke-width="1.6"/><text x="127.5" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">MinIO</text><text x="127.5" y="192" text-anchor="middle" font-size="12" fill="#334155">policy PDFs, FAQs</text><rect x="235" y="150" width="175" height="90" rx="10" fill="#47556914" stroke="#475569" stroke-width="1.6"/><text x="322.5" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Docling + embed</text><text x="322.5" y="192" text-anchor="middle" font-size="12" fill="#334155">open embedding model</text><line x1="215" y1="195" x2="235" y2="195" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="430" y="150" width="175" height="90" rx="10" fill="#47556914" stroke="#475569" stroke-width="1.6"/><text x="517.5" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Qdrant / pgvector</text><text x="517.5" y="192" text-anchor="middle" font-size="12" fill="#334155">vector index</text><line x1="410" y1="195" x2="430" y2="195" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><text x="40" y="300" font-size="13" fill="#1e293b" text-anchor="start">• re-sync when a document changes</text><text x="40" y="324" font-size="13" fill="#1e293b" text-anchor="start">• metadata (region, version) kept with each chunk</text><rect x="660" y="80" width="600" height="330" rx="12" fill="#0d94880d" stroke="#0d9488" stroke-width="1.2"/><text x="672" y="100" font-size="12" font-weight="800" fill="#0d9488" letter-spacing=".5">RETRIEVAL (online, per question)</text><rect x="680" y="150" width="175" height="90" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6"/><text x="767.5" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Research agent</text><text x="767.5" y="192" text-anchor="middle" font-size="12" fill="#334155">&quot;refund policy?&quot;</text><rect x="875" y="150" width="175" height="90" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6"/><text x="962.5" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Retrieve</text><text x="962.5" y="192" text-anchor="middle" font-size="12" fill="#334155">top-k chunks</text><line x1="855" y1="195" x2="875" y2="195" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><rect x="1070" y="150" width="175" height="90" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="1.6"/><text x="1157.5" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Answer</text><text x="1157.5" y="192" text-anchor="middle" font-size="12" fill="#334155">cites the chunk</text><line x1="1050" y1="195" x2="1070" y2="195" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="620" y1="195" x2="698" y2="195" stroke="#334155" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#a)"/><rect x="629.0" y="168" width="42.0" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="650" y="180" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">query</text><text x="680" y="300" font-size="13" fill="#1e293b" text-anchor="start">• a groundedness eval (Ragas) flags</text><text x="680" y="324" font-size="13" fill="#1e293b" text-anchor="start">  answers the chunks do not support</text><text x="20" y="450" font-size="13" fill="#1e293b" text-anchor="start">Policies live in RAG; facts about this customer live in the database. Mixing them is how agents quote the wrong refund limit.</text></svg>