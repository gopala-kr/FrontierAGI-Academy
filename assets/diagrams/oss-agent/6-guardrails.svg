<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" width="1280" height="500" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1280" height="500" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Guardrails in depth, self-hosted: five checks on one request</text><text x="24" y="56" font-size="13" fill="#475569">No single layer is trusted; each catches a different failure (red = can stop the request)</text><rect x="40" y="120" width="210" height="120" rx="10" fill="#dc262614" stroke="#dc2626" stroke-width="1.6"/><text x="145.0" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">1 Llama Guard (in)</text><text x="145.0" y="162" text-anchor="middle" font-size="12" fill="#334155">unsafe input;</text><text x="145.0" y="178" text-anchor="middle" font-size="12" fill="#334155">Presidio for PII</text><line x1="145" y1="240" x2="145" y2="300" stroke="#dc2626" stroke-width="1.7" marker-end="url(#r)"/><rect x="152.4" y="263" width="35.2" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="170" y="275" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">stop</text><rect x="70" y="302" width="150" height="44" rx="10" fill="#dc262614" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 4"/><text x="145.0" y="329.0" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">blocked + logged</text><rect x="285" y="120" width="210" height="120" rx="10" fill="#dc262614" stroke="#dc2626" stroke-width="1.6"/><text x="390.0" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">2 Keycloak + SPIFFE</text><text x="390.0" y="162" text-anchor="middle" font-size="12" fill="#334155">which user, which</text><text x="390.0" y="178" text-anchor="middle" font-size="12" fill="#334155">agent, on whose behalf</text><line x1="250" y1="180" x2="283" y2="180" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="390" y1="240" x2="390" y2="300" stroke="#dc2626" stroke-width="1.7" marker-end="url(#r)"/><rect x="397.4" y="263" width="35.2" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="415" y="275" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">stop</text><rect x="315" y="302" width="150" height="44" rx="10" fill="#dc262614" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 4"/><text x="390.0" y="329.0" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">blocked + logged</text><rect x="530" y="120" width="210" height="120" rx="10" fill="#dc262614" stroke="#dc2626" stroke-width="1.6"/><text x="635.0" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">3 OPA policy</text><text x="635.0" y="162" text-anchor="middle" font-size="12" fill="#334155">is this tool call</text><text x="635.0" y="178" text-anchor="middle" font-size="12" fill="#334155">allowed, within limits?</text><line x1="495" y1="180" x2="528" y2="180" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="635" y1="240" x2="635" y2="300" stroke="#dc2626" stroke-width="1.7" marker-end="url(#r)"/><rect x="642.4" y="263" width="35.2" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="660" y="275" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">stop</text><rect x="560" y="302" width="150" height="44" rx="10" fill="#dc262614" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 4"/><text x="635.0" y="329.0" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">blocked + logged</text><rect x="775" y="120" width="210" height="120" rx="10" fill="#dc262614" stroke="#dc2626" stroke-width="1.6"/><text x="880.0" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">4 RBAC / Vault</text><text x="880.0" y="162" text-anchor="middle" font-size="12" fill="#334155">least privilege;</text><text x="880.0" y="178" text-anchor="middle" font-size="12" fill="#334155">no keys in prompts</text><line x1="740" y1="180" x2="773" y2="180" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="880" y1="240" x2="880" y2="300" stroke="#dc2626" stroke-width="1.7" marker-end="url(#r)"/><rect x="887.4" y="263" width="35.2" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="905" y="275" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">stop</text><rect x="805" y="302" width="150" height="44" rx="10" fill="#dc262614" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 4"/><text x="880.0" y="329.0" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">blocked + logged</text><rect x="1020" y="120" width="210" height="120" rx="10" fill="#dc262614" stroke="#dc2626" stroke-width="1.6"/><text x="1125.0" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">5 Llama Guard (out)</text><text x="1125.0" y="162" text-anchor="middle" font-size="12" fill="#334155">unsafe or</text><text x="1125.0" y="178" text-anchor="middle" font-size="12" fill="#334155">leaking answers</text><line x1="985" y1="180" x2="1018" y2="180" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/><line x1="1125" y1="240" x2="1125" y2="300" stroke="#dc2626" stroke-width="1.7" marker-end="url(#r)"/><rect x="1132.4" y="263" width="35.2" height="16" rx="4" fill="#ffffff" opacity=".92"/><text x="1150" y="275" text-anchor="middle" font-size="11.5" fill="#1e293b" font-style="italic">stop</text><rect x="1050" y="302" width="150" height="44" rx="10" fill="#dc262614" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 4"/><text x="1125.0" y="329.0" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">blocked + logged</text><rect x="40" y="380" width="1200" height="70" rx="10" fill="#64748b14" stroke="#64748b" stroke-width="1.6"/><text x="640.0" y="420.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">OPA decision logs and Loki sit beside all five: every allowed or blocked call leaves an audit record a reviewer can replay.</text></svg>