<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="520" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Tech jobs 2006–2015 in three numbers</text><text x="24" y="56" font-size="13" fill="#475569">Sources: Challenger via eWeek ⚠️; BLS OES; NASSCOM via press ⚠️. Real dollars via CPI-U, our arithmetic.</text><text x="60" y="110" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">US tech-sector job cuts announced (Challenger)</text><rect x="80" y="222.202" width="96" height="217.798" rx="6" fill="#dc2626"/><text x="128" y="216.202" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">156k</text><text x="128" y="464" font-size="12" fill="#64748b" text-anchor="middle">2008</text><rect x="220" y="195.51940000000002" width="96" height="244.48059999999998" rx="6" fill="#dc2626"/><text x="268" y="189.51940000000002" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">175k</text><text x="268" y="464" font-size="12" fill="#64748b" text-anchor="middle">2009</text><text x="440" y="110" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">Software developer median pay (BLS)</text><rect x="460" y="187.41573439850313" width="96" height="252.58426560149687" rx="6" fill="#2563eb"/><text x="508" y="181.41573439850313" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">$126k</text><text x="508" y="464" font-size="12" fill="#64748b" text-anchor="middle">2010</text><text x="508" y="486" font-size="11" fill="#64748b" text-anchor="middle">($87.8k reported)</text><rect x="610" y="178.36486427479196" width="96" height="261.63513572520804" rx="6" fill="#2563eb"/><text x="658" y="172.36486427479196" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">$131k</text><text x="658" y="464" font-size="12" fill="#64748b" text-anchor="middle">2016</text><text x="658" y="486" font-size="11" fill="#64748b" text-anchor="middle">($100.1k reported)</text><text x="440" y="508" font-size="11" fill="#64748b" text-anchor="start">Bars in 2024 dollars. 2010 = applications developers.</text><text x="830" y="110" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">India IT-BPM direct jobs (NASSCOM)</text><rect x="850" y="244.0" width="96" height="196.0" rx="6" fill="#ea580c"/><text x="898" y="238.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">3.5M</text><text x="898" y="464" font-size="12" fill="#64748b" text-anchor="middle">FY2015</text><rect x="1000" y="195.83999999999997" width="96" height="244.16000000000003" rx="6" fill="#ea580c"/><text x="1048" y="189.83999999999997" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">4.36M</text><text x="1048" y="464" font-size="12" fill="#64748b" text-anchor="middle">FY2020</text></svg>