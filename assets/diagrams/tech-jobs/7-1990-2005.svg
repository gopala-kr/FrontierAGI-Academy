<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="540" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Tech jobs 1990–2005 in three numbers</text><text x="24" y="56" font-size="13" fill="#475569">Sources: CRS RL31973 and FindLaw (H-1B caps); InformationWeek ⚠️ (programmers); NASSCOM via academic papers ⚠️ (India).</text><text x="60" y="110" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">H-1B cap set by law</text><rect x="70" y="349.0" width="64" height="91.0" rx="6" fill="#0891b2"/><text x="102" y="343.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">65k</text><text x="102" y="464" font-size="12" fill="#64748b" text-anchor="middle">FY1991</text><rect x="155" y="279.0" width="64" height="161.0" rx="6" fill="#0891b2"/><text x="187" y="273.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">115k</text><text x="187" y="464" font-size="12" fill="#64748b" text-anchor="middle">FY1999</text><rect x="240" y="167.0" width="64" height="273.0" rx="6" fill="#0891b2"/><text x="272" y="161.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">195k</text><text x="272" y="464" font-size="12" fill="#64748b" text-anchor="middle">FY2001</text><rect x="325" y="349.0" width="64" height="91.0" rx="6" fill="#0891b2"/><text x="357" y="343.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">65k</text><text x="357" y="464" font-size="12" fill="#64748b" text-anchor="middle">FY2004</text><text x="60" y="500" font-size="11" fill="#64748b" text-anchor="start">FY2001–03: 195k cap never reached (bust).</text><text x="440" y="110" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">US computer programmers</text><rect x="460" y="172.60000000000002" width="96" height="267.4" rx="6" fill="#dc2626" opacity="1"/><text x="508" y="166.60000000000002" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">764k</text><text x="508" y="464" font-size="12" fill="#64748b" text-anchor="middle">H1 2000</text><rect x="610" y="218.79999999999998" width="96" height="221.20000000000002" rx="6" fill="#dc2626" opacity="0.6"/><text x="658" y="212.79999999999998" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">632k</text><text x="658" y="464" font-size="12" fill="#64748b" text-anchor="middle">after the bust</text><text x="440" y="500" font-size="11" fill="#64748b" text-anchor="start">−17%: about 132,000 programmer jobs gone.</text><text x="830" y="110" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">India IT workforce (NASSCOM)</text><rect x="850" y="373.73333333333335" width="96" height="66.26666666666667" rx="6" fill="#ea580c"/><text x="898" y="367.73333333333335" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">284k</text><text x="898" y="464" font-size="12" fill="#64748b" text-anchor="middle">FY2000</text><rect x="1000" y="206.66666666666666" width="96" height="233.33333333333334" rx="6" fill="#ea580c"/><text x="1048" y="200.66666666666666" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">1.0M</text><text x="1048" y="464" font-size="12" fill="#64748b" text-anchor="middle">FY2005</text><text x="830" y="500" font-size="11" fill="#64748b" text-anchor="start">FY2005 includes IT-enabled services (BPO).</text></svg>