<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1200" height="540" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">Tech jobs 1970–1990 in three numbers</text><text x="24" y="56" font-size="13" fill="#475569">Sources: US Census Bureau CB16-139 (IT workers, women in IT); NSF data via Stanford and Olson ⚠️ (degrees).</text><text x="60" y="110" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">US IT workers (Census)</text><rect x="80" y="414.8" width="96" height="25.2" rx="6" fill="#2563eb"/><text x="128" y="408.8" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">450k</text><text x="128" y="464" font-size="12" fill="#64748b" text-anchor="middle">1970</text><rect x="230" y="182.39999999999998" width="96" height="257.6" rx="6" fill="#2563eb"/><text x="278" y="176.39999999999998" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">4.6M</text><text x="278" y="464" font-size="12" fill="#64748b" text-anchor="middle">2014</text><text x="60" y="500" font-size="11" fill="#64748b" text-anchor="start">Tenfold growth; 1970 was the first IT count.</text><text x="440" y="110" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">Women, % of CS bachelor’s degrees</text><rect x="450" y="179.59999999999997" width="64" height="260.40000000000003" rx="6" fill="#db2777"/><text x="482" y="173.59999999999997" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">37.2%</text><text x="482" y="464" font-size="12" fill="#64748b" text-anchor="middle">1984</text><rect x="535" y="244.0" width="64" height="196.0" rx="6" fill="#db2777"/><text x="567" y="238.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">28%</text><text x="567" y="464" font-size="12" fill="#64748b" text-anchor="middle">2000</text><rect x="620" y="314.0" width="64" height="126.0" rx="6" fill="#db2777"/><text x="652" y="308.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">18%</text><text x="652" y="464" font-size="12" fill="#64748b" text-anchor="middle">2010</text><rect x="705" y="279.0" width="64" height="161.0" rx="6" fill="#db2777"/><text x="737" y="273.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">23%</text><text x="737" y="464" font-size="12" fill="#64748b" text-anchor="middle">2022</text><text x="830" y="110" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">Women, % of US IT workers (Census)</text><rect x="850" y="223.0" width="96" height="217.0" rx="6" fill="#9333ea"/><text x="898" y="217.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">31%</text><text x="898" y="464" font-size="12" fill="#64748b" text-anchor="middle">1990</text><rect x="1000" y="265.0" width="96" height="175.0" rx="6" fill="#9333ea"/><text x="1048" y="259.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">25%</text><text x="1048" y="464" font-size="12" fill="#64748b" text-anchor="middle">2014</text><text x="830" y="500" font-size="11" fill="#64748b" text-anchor="start">1990 was the peak.</text></svg>